<!doctype html>
<html lang="en">
<head>
<title>Paint a Picture</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
</head>
<body>
<style>
/* Layout: phone-shaped app. Home = a dark, immersive pixel world with glass controls (mark top-left, menu top-right, Goals / This week at the bottom).
   Product screens = warm light paper, editorial serif titles, compact ruled lists, bottom sheets for editing. */
:root{
  --paper:#f7f4ee; --surface:#fffdf9; --sunk:#f0ece3;
  --ink:#1f2420; --ink-2:#474c46; --muted:#7a7b73; --line:#e6e0d4; --line-2:#d6cfbf;
  --accent:#f04f85; --accent-strong:#cf3367; --accent-2:#b82a5a; --accent-ink:#c22f60; --accent-soft:#fde8ef;
  --amber:#8f5c14; --amber-soft:#f5ead6; --sea:#2c6a88; --sea-soft:#e2edf2; --danger:#9b3b2a;
  --night:#0f1420; --glass:rgba(16,19,27,.84); --glass-line:rgba(255,255,255,.14);
  --serif:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans:"Manrope", "Helvetica Neue", system-ui, sans-serif;
  --r-sm:8px; --r:12px; --r-lg:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;position:relative;overflow:hidden;background:var(--paper)}
@media (min-width:560px){#app{box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(31,36,32,.14)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- home ---------- */
.home{background:var(--night);color:#fff}
#stage{position:absolute;inset:0}
#scene{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
#scene:focus-visible{outline:none}
.home-top{position:absolute;inset:0 0 auto;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.home-top>*{pointer-events:auto}
.mark{display:grid;gap:1px;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.mark-name{font-family:var(--serif);font-size:27px;line-height:1;letter-spacing:.005em}
.mark-sub{font-size:12px;font-weight:600;color:rgba(255,255,255,.78);letter-spacing:.02em}
.gbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;border:1px solid var(--glass-line);background:var(--glass);color:#fff;
  }
.gbtn:hover{background:rgba(30,36,48,.75)}
.home-chips{position:absolute;top:66px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:5;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip-g{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;border-radius:99px;border:1px solid var(--glass-line);background:var(--glass);color:#fff;
  font-size:12px;font-weight:700;padding:6px 11px;}
.chip-g.gold{background:rgba(232,196,110,.92);color:#2b2108;border-color:transparent}
.chip-g .ico{width:14px;height:14px}
.mapctl{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:5;display:grid;gap:1px;border-radius:14px;overflow:hidden;
  border:1px solid var(--glass-line);background:var(--glass-line);}
.mapctl button{width:40px;height:40px;display:grid;place-items:center;border:0;background:var(--glass);color:#fff}
.mapctl button:hover{background:rgba(30,36,48,.8)}
.mapctl .ico{width:17px;height:17px}
.home-tabs{position:absolute;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:10px;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.htab{display:flex;align-items:center;justify-content:center;gap:9px;height:54px;border-radius:16px;border:1px solid var(--glass-line);background:var(--glass);color:#fff;
  font-weight:700;font-size:15px;letter-spacing:.01em;}
.htab:hover{background:rgba(30,36,48,.8)}
.htab.main{background:rgba(247,244,238,.95);color:var(--ink);border-color:transparent}
.loccard{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:6;
  background:rgba(247,244,238,.97);color:var(--ink);border-radius:var(--r-lg);padding:14px 14px 12px;display:grid;gap:8px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.loccard .row{display:flex;gap:12px;align-items:flex-start}
.loccard h3{font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.1;margin:0}
.loccard .meta{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.loccard p{margin:0;font-size:13.5px;color:var(--ink-2)}
.loccard .thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:none;background:var(--sunk)}
.loccard .x{margin-left:auto}
.clar{display:grid;gap:5px}
.clar-bar{height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.clar-bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.clar-txt{font-size:12.5px;color:var(--muted);font-weight:600}
.bubble{position:absolute;z-index:6;transform:translate(-50%,-100%);background:rgba(247,244,238,.97);color:var(--ink);border-radius:12px;padding:7px 11px;
  font-size:13px;font-weight:600;max-width:220px;text-align:center;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:rgba(247,244,238,.97);border-bottom:0}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--glass);border:1px solid var(--glass-line);
  color:rgba(255,255,255,.9);font-size:12px;font-weight:600;padding:7px 12px;border-radius:99px;white-space:nowrap;pointer-events:none;}
.journey{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:5;
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:30px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-line);padding:0 6px}
.journey::before{content:"";position:absolute;left:18px;right:18px;top:50%;height:1px;background:rgba(255,255,255,.22)}
.journey button{all:unset;cursor:pointer;position:relative;z-index:1;text-align:center;font-size:11px;font-weight:700;letter-spacing:.02em;color:rgba(255,255,255,.62);padding:6px 0}
.journey button[aria-current="true"]{color:#fff}
.journey button:focus-visible{outline:2px solid var(--accent);border-radius:8px}
.journey .you{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(240,79,133,.3);transition:left .2s;pointer-events:none}
.vision-banner{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:6;background:rgba(247,244,238,.97);color:var(--ink);border-radius:99px;padding:8px 14px;
  font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.3)}

/* ---------- product pages ---------- */
.pages{background:var(--paper)}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--paper)}
.brand{all:unset;cursor:pointer;font-family:var(--serif);font-size:24px;line-height:1}
.pbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.pbtn:hover{background:var(--sunk)}
.pmain{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.page{padding:22px max(18px,env(safe-area-inset-right,0px)) 32px max(18px,env(safe-area-inset-left,0px));display:grid;gap:22px;align-content:start}
.pnav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.pnav button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:3px;padding:9px 0 10px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.pnav button[aria-current="page"]{color:var(--accent-ink)}
.pnav button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.phead h1{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1;margin:0;letter-spacing:-.005em}
.phead .sub{font-size:13.5px;color:var(--muted);font-weight:600;margin-top:6px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h2.sec{font-family:var(--serif);font-weight:400;font-size:24px;margin:0;line-height:1.1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:var(--r);padding:10px 15px;font-weight:700;font-size:14px;background:var(--accent-strong);color:#fff;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.quiet{background:transparent;color:var(--accent-ink);padding:6px 8px}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.danger{background:var(--surface);color:var(--danger);border-color:#e7c6bd}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn .ico{width:16px;height:16px}
.seg{display:inline-flex;background:var(--sunk);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 12px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(31,36,32,.12)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list>li{border-bottom:1px solid var(--line)}
.rowbtn{all:unset;display:grid;gap:6px;width:100%;box-sizing:border-box;padding:15px 2px;cursor:pointer}
.rowbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
.rtitle{font-weight:700;font-size:16px;line-height:1.3}
.rmeta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);font-weight:600;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--ink-2);letter-spacing:.01em}
.tag.green{background:var(--accent-soft);color:#ad2856} .tag.amber{background:var(--amber-soft);color:var(--amber)} .tag.sea{background:var(--sea-soft);color:var(--sea)}
.tag.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.bar{height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.empty{padding:22px 4px;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-weight:400;font-size:22px;margin-bottom:4px}
.detail{padding:2px 2px 18px;display:grid;gap:14px}
.detail p{margin:0;color:var(--ink-2);font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.steps li{display:flex;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.steps li.done span{color:var(--muted);text-decoration:line-through}
.cb{width:20px;height:20px;flex:none;border:1.5px solid var(--line-2);border-radius:6px;background:var(--surface);display:grid;place-items:center;padding:0}
.cb[aria-checked="true"]{background:var(--accent-strong);border-color:var(--accent-strong)}
.cb[aria-checked="true"]::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.notice{border-radius:var(--r);background:var(--amber-soft);padding:12px 13px;display:grid;gap:10px;font-size:13.5px;color:#5d4316}
.notice b{color:#3d2c0c}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.history{font-size:12.5px;color:var(--muted);display:grid;gap:3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.stats div{padding:12px 6px;text-align:center;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.panel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px;display:grid;gap:12px}
.insight{font-size:14px;color:var(--ink-2);display:grid;gap:6px}
.insight div{display:flex;gap:9px}
.insight div::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px}
.weeknav{display:flex;align-items:center;gap:6px}
.entry{padding:14px 2px;display:grid;gap:7px}
.entry .t{font-size:15px;font-weight:600}
.entry .refl{font-size:13px;color:var(--ink-2);display:grid;gap:2px}
.entry .refl span b{color:var(--muted);font-weight:700}
.asp{display:flex;gap:13px;align-items:center}
.asp canvas,.asp img{width:56px;height:56px;border-radius:12px;flex:none;object-fit:cover;image-rendering:pixelated;background:#6f9c4a}
.asp .grow{min-width:0;flex:1;display:grid;gap:4px}
.asp .d{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* forms + sheet */
.field{display:grid;gap:6px}
.field>span{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.field small{font-size:12px;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;min-width:0;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:11px 12px;font-size:15px;font-weight:500;line-height:1.35}
textarea{resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:#a3a39a}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-strong);outline-offset:0;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scrim{position:absolute;inset:0;background:rgba(20,22,20,.38);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:92%;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border-radius:22px 22px 0 0;
  box-shadow:0 -20px 60px rgba(0,0,0,.25);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:.4}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px))}
.sheet-h h2{font-family:var(--serif);font-weight:400;font-size:28px;margin:0;line-height:1.05}
.sheet-b{overflow:auto;padding:4px max(18px,env(safe-area-inset-right,0px)) 16px max(18px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.sheet-f{display:flex;justify-content:space-between;gap:10px;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.progress-dots{display:flex;gap:5px}
.progress-dots i{width:22px;height:4px;border-radius:9px;background:var(--line)}
.progress-dots i.on{background:var(--accent)}
.sugg{display:grid;gap:8px}
.sugg-item{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.sugg-item[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sugg-item .grow{flex:1;min-width:0;display:grid;gap:2px}
.sugg-item b{font-size:14.5px}
.sugg-item small{font-size:12.5px;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;background:var(--surface)}
.pill[aria-pressed="true"]{background:var(--accent-soft);color:#ad2856;border-color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.imgdrop{display:flex;gap:12px;align-items:center}
.imgdrop img{width:72px;height:72px;border-radius:12px;object-fit:cover;background:var(--sunk)}
.kindprev{width:72px;height:66px;border-radius:12px;image-rendering:pixelated;background:#6f9c4a;flex:none}
.menu{position:absolute;top:64px;right:max(16px,env(safe-area-inset-right,0px));z-index:30;min-width:220px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:6px;
  box-shadow:0 20px 50px rgba(0,0,0,.22);display:grid}
.menu button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;font-weight:700;font-size:14.5px}
.menu button:hover,.menu button:focus-visible{background:var(--sunk)}
.menu small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 6px}
.toast{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;z-index:40;background:var(--ink);color:var(--paper);
  font-weight:700;font-size:13.5px;padding:10px 15px;border-radius:12px;transition:transform .25s,opacity .25s;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.top{bottom:auto;top:calc(118px + env(safe-area-inset-top,0px))}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent-strong)}
#avatarPrev{width:77px;height:112px;border-radius:14px;image-rendering:pixelated;background:#6f9c4a;flex:none}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <!-- HOME: the world -->
  <section class="screen home" id="home">
    <div id="stage"><canvas id="scene" tabindex="0" aria-label="Your dream life world. One finger or mouse drag moves the lens, two fingers or scroll move the map, arrow keys pan."></canvas></div>
    <header class="home-top">
      <div class="mark"><span class="mark-name">Paint a Picture</span><span class="mark-sub" id="greet"></span></div>
      <button class="gbtn" data-menu aria-label="Open menu" aria-haspopup="true"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    </header>
    <div class="home-chips" id="homeChips"></div>
    <div class="mapctl" role="group" aria-label="Map controls">
      <button id="zin" aria-label="Zoom in"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zout" aria-label="Zoom out"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="recenter" aria-label="Show me"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>

function wireGoalDetail(el){

async function readImage(file){
  const url = URL.createObjectURL(file), img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const k = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const g = c.getContext("2d"); g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
  // the average colour (ignoring very dark and very light pixels) tints the landmark
  const d = g.getImageData(0, 0, c.width, c.height).data; let r = 0, gg = 0, b = 0, n = 0;
  for (let i = 0; i < d.length; i += 16) { const l = d[i] + d[i + 1] + d[i + 2]; if (l < 90 || l > 690) continue; const sat = Math.max(d[i], d[i + 1], d[i + 2]) - Math.min(d[i], d[i + 1], d[i + 2]); const w = 1 + sat / 40; r += d[i] * w; gg += d[i + 1] * w; b += d[i + 2] * w; n += w; }
  const tint = n ? toHex([r / n, gg / n, b / n]) : null;
  const blob = await new Promise(res => c.toBlob(res, "image/jpeg", .82));
  return {blob, dataUrl: c.toDataURL("image/jpeg", .7), tint};
}

/* --- backup and restore: one JSON file holding everything --- */
function backupData(){
  const images = {};
  for (const a of S.aspirations) if (a.image && a.image.local) { const d = localImg(a.image.local); if (d) images[a.image.local] = d; }
  return JSON.stringify({app: "paint-a-picture", version: 2, exportedAt: new Date().toISOString(), state: S, images});
}
async function downloadBackup(){
  const btn = $("backupBtn"), filename = `paint-a-picture-backup-${today()}.json`;
  btn.disabled = true;
  const done = () => { S.lastBackup = today(); save(); toast("Backup saved. Keep the file somewhere safe."); renderAccount(); };
  try {
    if (downloadsApi) { await downloadsApi.save({filename, data: backupData()}); done(); }
    else if (window.claude?.use) toast("Downloads aren't available in this view. Open the app in your browser to back up.");
    else { // the standalone copy outside claude.ai
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([backupData()], {type: "application/json"})); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); done();
    }
  } catch (e) { toast(e && e.code === "cancelled" ? "Backup not saved." : "Couldn't save the backup file. Try again."); }
  finally { if ($("backupBtn")) $("backupBtn").disabled = false; }
}
async function restoreBackup(file){
  let parsed = null;
  try { parsed = JSON.parse(await file.text()); } catch (e) {}
  const st = parsed && (parsed.app === "paint-a-picture" || parsed.app === "dream-life") && parsed.state;
  if (!st || !Array.isArray(st.goals) || !Array.isArray(st.entries)) { toast("That file isn't a Paint a Picture backup."); return; }
  const incoming = migrate(st), box = $("restoreConfirm");
  const when = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleDateString(undefined, {day: "numeric", month: "short", year: "numeric"}) : "an earlier date";
  box.innerHTML = `<div><b>Restore the backup from ${esc(when)}?</b> It has ${incoming.aspirations.length} dreams, ${incoming.goals.length} goals and ${incoming.entries.length} entries. It replaces what's here now, so download a backup of the current data first if you might want it.</div>
    <div class="actions"><button class="btn sm" id="restoreYes" type="button">Replace with backup</button><button class="btn sm ghost" id="restoreNo" type="button">Cancel</button></div>`;
  box.hidden = false;
  $("restoreNo").onclick = () => { box.hidden = true; };
  $("restoreYes").onclick = () => {
    for (const [k, v] of Object.entries(parsed.images || {})) { try { localStorage.setItem("dreamLife.img." + k, v); } catch (e) {} }
    S = incoming; S.onboarded = true; bgKey = ""; afterChange(); save();
    toast("Restored. Everything from the backup is back."); renderAccount();
  };
}

  A("a3", "A light-filled design studio", "My own studio with big windows, two or three people I love working with.", "Career & creative work", "studio", "5–10 years");
  A("a4", "Drive a vintage Porsche", "A 911 from the 80s, cream interior.", "Money & material", "car", "10–15 years");
  A("a5", "A garden that feeds us", "Tomatoes, herbs, a lemon tree.", "Home & surroundings", "garden", "10–15 years");
  A("a6", "Travel to Japan", "Two slow weeks: Kyoto, the islands, a ryokan.", "Experiences & adventures", "balloon", "Within 2 years");
  A("a7", "Sunday lunches with family in Delhi", "The whole family around one table, every visit home.", "Relationships & lifestyle", "picnic", "Within 2 years", "delhi");
  A("a8", "A sea-facing flat in Mumbai", "A place to come back to on Marine Drive.", "Places to live", "villa", "10–15 years", "mumbai");
  const G = (id, title, aspirationId, start, deadline, ms, extra) => s.goals.push(Object.assign({id, title, desc: "", aspirationId, start, deadline, priority: "", status: "active", doneAt: null, milestones: ms.map(([t, done], i) => ({id: id + "m" + i, title: t, doneAt: done ? d(done) : null})), deadlineHistory: [], createdAt: start}, extra || {}));
  G("g1", "Launch my portfolio site", "a3", d(-35), d(-6), [["Pick 4 case studies", -20], ["Write the about page", -9], ["Build the site", 0], ["Share it with 10 people", 0]], {priority: "High", desc: "The front door to studio work."});
  G("g2", "Take 10 surf lessons", "a2", d(-20), d(40), [["Research surf schools", -3], ["Book the first lesson", 0]]);
  G("g3", "Save $5k for the LA move", "a1", d(-30), d(90), [["Open a separate savings account", -25], ["Save $1k", -8], ["Save $2.5k", 0]]);
  G("g4", "Read 4 design books", "a3", d(-60), d(-12), [], {status: "done", doneAt: d(-14)});
  G("g5", "Fly home for Diwali", "a7", d(-10), d(25), [["Book the flights", -4]]);
  const E = (n, text, goalIds, size, type, extra) => s.entries.push(Object.assign({id: "e" + n, date: d(n), text, goalIds, size, type, learned: "", blocked: "", next: "", example: true}, extra || {}));
  E(-15, "Finished the last design book", ["g4"], 2, "did");
  E(-9, "Wrote the about page draft", ["g1"], 2, "did", {learned: "Short beats clever"});
  E(-8, "Moved $500 into the LA fund", ["g3"], 2, "did");
  E(-3, "Researched three surf schools and compared course prices", ["g2"], 1, "did", {next: "Book a morning lesson"});
  E(-2, "Sketched the studio logo", [], 1, "worked");
  E(-4, "Booked flights home to Delhi for Diwali", ["g5"], 2, "did");
  E(-1, "Rebuilt the portfolio homepage layout", ["g1"], 2, "worked", {blocked: "Client deadline ate two evenings"});
  return s;
}

/* --- first run --- */
function welcome(){
  openSheet("Welcome to Paint a Picture", `<p style="margin:0;font-size:15px;color:var(--ink-2)">This is a world shaped like the life you want in 10–15 years. It starts in the dark. Every bit of real progress you log on your goals makes a part of it clearer.</p>
    <div class="insight"><div>Describe your dreams. Each one becomes a place on the map.</div><div>Link goals to them, then log what you actually do each week.</div><div>Meet a deadline and you earn a 10-second view of the whole picture. Miss one and you lose nothing.</div></div>`,
    `<button class="btn ghost" id="wDemo">Explore an example</button><button class="btn" id="wMine">Start mine</button>`, () => {
      $("wDemo").onclick = () => { S = demoState(S.profile); afterChange(); save(); closeSheet(); toast("Example world loaded. Clear it any time in Account."); };
      $("wMine").onclick = () => { S.onboarded = true; save(); closeSheet(); go("dreams"); editAspiration(null); };
    });
}

/* =====================================================================
   6. BOOT
   ===================================================================== */
try { S = migrate(JSON.parse(localStorage.getItem(LS_KEY) || "null")); } catch (e) { S = blankState(); }
try { if (localStorage.getItem("dreamLife.hint")) $("hint").hidden = true; } catch (e) {}
addEventListener("resize", () => { if (route === "home") sizeScene(); });
go(location.hash.slice(1) || "home");
requestAnimationFrame(loop);
if (!S.onboarded) setTimeout(() => { if (!S.onboarded) welcome(); }, 600);

(async () => {
  if (!window.claude?.use) return;
  window.claude.use("sample").then(s => { sampleFn = s; });
  window.claude.use("assets").then(a => { assetsApi = a; });
  window.claude.use("downloads").then(d => { downloadsApi = d; });
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  const id = user ? await user.id() : null;
  if (!db || !id) return;
  docRef = db.doc("data/users/" + id + "/life");
  docRef.onSnapshot(snap => {
    if (snap.exists) {
      if (snap.metadata.hasPendingWrites || saving) return;
      const incoming = JSON.stringify(snap.data());
      if (incoming === lastSynced || incoming === JSON.stringify(S)) { lastSynced = incoming; return; }
      lastSynced = incoming;
      S = migrate(JSON.parse(incoming));
      try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
      storageNote = "Saved to your Claude account. Only you can see it.";
      if (S.onboarded && !$("sheet").hidden && $("sheetTitle")?.textContent === "Welcome to Paint a Picture") closeSheet();
      if (typingInPage()) pendingRender = true; else afterChange();
    } else if (!snap.metadata.fromCache) save();
  }, () => {});
})();
</script>
