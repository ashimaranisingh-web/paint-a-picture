<!doctype html>
<html lang="en">
<head>
<title>Paint a Picture</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
</head>
<body>
<style>
/* Layout: phone-shaped app. Home = a dark, immersive pixel world with glass controls (mark top-left, menu top-right, Goals / This week at the bottom).
   Product screens = warm light paper, editorial serif titles, compact ruled lists, bottom sheets for editing. */
:root{
  --safe-top:env(safe-area-inset-top,0px); /* the notch / Dynamic Island; the desktop iPhone 14 frame uses 47px */
  --paper:#f7f4ee; --surface:#fffdf9; --sunk:#f0ece3;
  --ink:#1f2420; --ink-2:#474c46; --muted:#686961; --line:#e6e0d4; --line-2:#d6cfbf;
  --accent:#f04f85; --accent-strong:#cf3367; --accent-2:#b82a5a; --accent-ink:#c22f60; --accent-soft:#fde8ef;
  --amber:#8f5c14; --amber-soft:#f5ead6; --sea:#2c6a88; --sea-soft:#e2edf2; --danger:#9b3b2a;
  --night:#0f1420; --glass:rgba(16,19,27,.84); --glass-line:rgba(255,255,255,.14);
  --serif:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans:"Manrope", "Helvetica Neue", system-ui, sans-serif;
  --r-xs:4px; --r-sm:8px; --r:12px; --r-lg:12px; /* corners: 4, 8 or 12px, never more (pills stay round) */
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}
#app{height:100%;max-width:390px;margin:0 auto;position:relative;overflow:hidden;background:var(--paper)}
/* On a computer the app is shown at iPhone 14 size (390 × 844), centred; on a phone it fills the screen. */
@media (min-width:560px){#app{box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(31,36,32,.14)}}
@media (min-width:560px) and (min-height:880px){body{display:grid;place-items:center}#app{width:390px;height:844px;border-radius:12px;--safe-top:47px}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}


/* ---------- profile selector (Home header) and the demo strip on pages ---------- */
.prof{position:relative}
.prof-btn{display:flex;align-items:center;gap:4px;height:40px;padding:0 10px 0 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:13px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.prof-btn .ico{width:16px;height:16px;stroke-width:2.2;transition:transform .2s}.prof-btn[aria-expanded="true"] .ico{transform:rotate(180deg)}
body.demo-on .prof-btn{border-color:var(--accent);color:var(--accent-ink)}
.prof-menu{position:absolute;top:48px;right:0;z-index:31;width:256px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 14px 30px rgba(31,36,32,.14);display:grid}
.prof-menu button{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border-radius:8px}
.prof-menu button:hover,.prof-menu button:focus-visible{background:var(--sunk)}
.prof-menu .grow{flex:1;min-width:0;display:grid;gap:1px}.prof-menu b{font-size:15px}.prof-menu small{font-size:12px;font-weight:500;color:var(--muted);line-height:1.35}
.prof-menu .tick{width:20px;height:20px;flex:none;color:var(--accent-ink);visibility:hidden}.prof-menu [aria-checked="true"] .tick{visibility:visible}
.prof-menu [aria-checked="true"] b{color:var(--accent-ink)}
.demo-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:#fef3f6;border-top:1px solid #f6d3df;font-size:13px;color:var(--accent-ink)}
body.demo-on .toast:not(.top){bottom:calc(136px + env(safe-area-inset-bottom,0px))} /* clear of the Demo Data strip */
.demo-strip button{all:unset;cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:32px;display:flex;align-items:center}
/* ---------- the loader: one screen for the bigger jobs ---------- */
.swiping{box-shadow:-10px 0 30px rgba(31,36,32,.18)}

/* onboarding on white: bordered fields, light grey until answered, white with a black edge once they are */
.ob:not(.ob-dark),.ob:not(.ob-dark) .ob-foot{background:#fff}
.ob:not(.ob-dark) :is(input[type=text],input[type=search],input[type=email],textarea){border:1px solid #e3e1dc;border-radius:12px;background:#f5f5f3;padding:13px 14px;transition:background-color .15s,border-color .15s}
.ob:not(.ob-dark) :is(input[type=text],input[type=search],input[type=email],textarea):focus{background:#fff;border-color:#8b8b83;box-shadow:none}
.ob:not(.ob-dark) :is(input[type=text],input[type=search],input[type=email],textarea):not(:placeholder-shown){background:#fff;border-color:var(--ink)}
.ob:not(.ob-dark) select{border:1px solid var(--ink);border-radius:8px;background-color:#fff}
.ob:not(.ob-dark) .panel,.ob:not(.ob-dark) .empty{background:#fff}
.ob:not(.ob-dark) .pill{background:#f3f3f1;border-color:#f3f3f1;color:var(--ink)}
.ob:not(.ob-dark) .pill[aria-pressed="true"]{background:#fff;border-color:var(--accent);color:var(--ink)}
.ob-hint{margin:-2px 0 8px;font-size:13px;color:var(--muted)}
.loader{position:absolute;inset:0;z-index:50;background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(var(--safe-top) + 60px) 32px calc(56px + env(safe-area-inset-bottom,0px));transition:opacity .25s}
.loader.out{opacity:0}
.ld-art canvas{width:240px;height:180px;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:12px;display:block}
.ld-h{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.15;margin:36px 0 0;max-width:300px}
.ld-msg{margin:12px 0 0;font-size:15px;color:var(--muted);min-height:45px;max-width:300px;transition:opacity .2s}
.ld-bar{margin-top:auto;width:min(240px,70%);height:6px;border-radius:99px;background:#f8e1ea;overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---------- home ---------- */
.home{background:var(--night);color:#fff}
#stage{position:absolute;inset:0}
#scene{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
#scene:focus-visible{outline:none}
.home-top{position:absolute;inset:0 0 auto;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(var(--safe-top) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.home-top>*{pointer-events:auto}
.mark{display:grid;gap:1px;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.mark-name{font-size:11px;font-weight:500;line-height:1.3;color:rgba(255,255,255,.82);letter-spacing:.04em;text-transform:uppercase}
.mark-app{font-family:var(--sans);font-size:13px;font-weight:600;color:rgba(255,255,255,.78);letter-spacing:.01em}
.mark-sub{font-family:var(--serif);font-size:24px;line-height:1.1;color:#fff;letter-spacing:.005em}
.gbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--glass-line);background:var(--glass);color:#fff;
  }
.gbtn:hover{background:rgba(30,36,48,.75)}
.gbtn,.pbtn{position:relative}
body.demo-on [data-menu]::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px rgba(16,19,27,.6)}
.home-chips{position:absolute;top:calc(var(--safe-top) + 66px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:5;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip-g{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;border-radius:99px;border:1px solid var(--glass-line);background:var(--glass);color:#fff;
  font-size:13px;font-weight:700;padding:6px 11px;}
.chip-g.gold{background:rgba(232,196,110,.92);color:#2b2108;border-color:transparent}
.chip-g .ico{width:14px;height:14px}
.chip-g.eye{width:44px;height:44px;padding:0;justify-content:center}.chip-g.eye .ico{width:20px;height:20px}
.mapctl{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:5;display:grid;gap:1px;border-radius:12px;overflow:hidden;
  border:1px solid var(--glass-line);background:var(--glass-line);}
.mapctl button{width:44px;height:44px;display:grid;place-items:center;border:0;background:var(--glass);color:#fff}
.mapctl button:hover{background:rgba(30,36,48,.8)}
.mapctl .ico{width:17px;height:17px}
.mapctl button.eye .ico{width:20px;height:20px}
.mapctl button.eye.ready,.mapctl button.eye.open{background:rgba(232,196,110,.92);color:#2b2108}.mapctl button.eye.ready:hover{background:#e8c46e}
.mapctl button.eye.off{color:rgba(255,255,255,.4)}
.eye-open,.eye-shut{transform-origin:12px 12px;transition:transform .45s ease,opacity .3s ease}
.eye .eye-open{transform:scaleY(.08);opacity:0}.eye.open .eye-open{transform:none;opacity:1}.eye.open .eye-shut{opacity:0;transform:scaleY(.4)}
@media (prefers-reduced-motion:reduce){.eye-open,.eye-shut{transition:none}}
.home-tabs{position:absolute;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:10px;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.htab{display:flex;align-items:center;justify-content:center;gap:9px;height:54px;border-radius:12px;border:1px solid var(--glass-line);background:var(--glass);color:#fff;
  font-weight:700;font-size:15px;letter-spacing:.01em;}
.htab:hover{background:rgba(30,36,48,.8)}
.htab.main{background:rgba(247,244,238,.95);color:var(--ink);border-color:transparent}
.loccard{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:6;
  background:rgba(247,244,238,.97);color:var(--ink);border-radius:var(--r-lg);padding:14px 14px 12px;display:grid;gap:8px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.loccard .row{display:flex;gap:12px;align-items:flex-start}
.lc-info{flex:1;min-width:0;display:grid;gap:4px;padding:4px 0}.lc-desc{margin:0;font-size:13px;line-height:1.4;color:var(--ink-2)}
.loccard h3{font-size:14px;font-weight:600;line-height:1.3;margin:0}
.lc-open{all:unset;cursor:pointer;flex:1;min-width:0;display:grid;gap:4px;padding:4px 0}.lc-open:focus-visible{outline:2px solid var(--accent);border-radius:8px}
.lc-open .clar-bar{margin-top:4px}

.loccard .meta{font-size:11px;font-weight:500;line-height:1.3;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)} /* small caps label above a title, like the one above "Hi Maya"; ~7.6:1 on the card */
.loccard p{margin:0;font-size:13px;color:var(--ink-2)}
.loccard .thumb{width:58px;height:58px;border-radius:8px;object-fit:cover;flex:none;background:var(--sunk)}
.loccard .x{margin-left:auto}
.lc-pic{width:76px;height:76px;flex:none;border-radius:8px;overflow:hidden;background:var(--sunk)}.lc-pic img,.lc-pic canvas{display:block;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.lc-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lc-side{display:grid;gap:2px;margin:-6px -6px 0 0}
.lc-hint{display:block;margin-top:6px;font-size:11px;color:var(--muted);font-weight:600}
.clar{display:grid;gap:5px}
.clar-bar{height:4px;border-radius:8px;background:var(--line);overflow:hidden}
.clar-bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.clar-txt{font-size:13px;color:var(--muted);font-weight:600}
.bubble{position:absolute;z-index:6;transform:translate(-50%,-100%);background:rgba(247,244,238,.97);color:var(--ink);border-radius:12px;padding:7px 11px;
  font-size:13px;font-weight:600;max-width:220px;text-align:center;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:rgba(247,244,238,.97);border-bottom:0}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--glass);border:1px solid var(--glass-line);
  color:rgba(255,255,255,.9);font-size:13px;font-weight:600;padding:7px 12px;border-radius:99px;white-space:nowrap;pointer-events:none;}
.journey{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:5;
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:30px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-line);padding:0 6px}
.journey::before{content:"";position:absolute;left:18px;right:18px;top:50%;height:1px;background:rgba(255,255,255,.22)}
.journey button{all:unset;cursor:pointer;position:relative;z-index:1;text-align:center;font-size:11px;font-weight:700;letter-spacing:.02em;color:rgba(255,255,255,.62);padding:6px 0}
.journey button[aria-current="true"]{color:#ff8db3}
.journey button:focus-visible{outline:2px solid var(--accent);border-radius:8px}
/* the original dot: it sits on the line behind the names and glides to the place you're looking at, its glow lighting the name it passes */
.journey .you{position:absolute;z-index:0;top:50%;left:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(240,79,133,.3),0 0 16px 6px rgba(240,79,133,.32);transition:left .7s cubic-bezier(.4,0,.2,1);pointer-events:none;will-change:left}
.vision-banner{position:absolute;left:50%;top:calc(var(--safe-top) + 70px);transform:translateX(-50%);z-index:6;background:rgba(247,244,238,.97);color:var(--ink);border-radius:99px;padding:8px 14px;
  font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.3)}

/* ---------- product pages ---------- */
.pages{background:var(--paper)}
.iconbtn{all:unset;cursor:pointer;box-sizing:border-box;width:44px;height:44px;display:grid;place-items:center;margin-left:-12px;border-radius:12px;color:var(--ink);flex:none}
.iconbtn:hover{background:var(--sunk)}.iconbtn:focus-visible{outline:2px solid var(--accent-strong);outline-offset:-2px}
.pmain{padding-top:var(--safe-top)}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--paper)}
.brand{all:unset;cursor:pointer;display:flex;align-items:center;min-height:44px;font-family:var(--serif);font-size:20px;line-height:1}
.pbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.pbtn:hover{background:var(--sunk)}
.pmain{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.page{padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));display:grid;gap:20px;align-content:start}
.pnav{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.pnav button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:3px;padding:9px 0 10px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.pnav button[aria-current="page"]{color:var(--accent-ink)}
.pnav button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.phead h1{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1;margin:0;letter-spacing:-.005em}
.phead .sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}
.page>.psub{margin:-4px 0 0;font-size:14px;line-height:1.45;color:var(--muted);font-weight:500} /* a page's line sits under the header rule, not inside it */
/* page headers stay put while the page scrolls under them */
.page>.phead{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin:-16px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:16px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h2.sec{font-family:var(--serif);font-weight:400;font-size:20px;margin:0;line-height:1.1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border:1px solid transparent;border-radius:var(--r);padding:10px 15px;font-weight:700;font-size:15px;background:var(--accent-strong);color:#fff;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.quiet{background:transparent;color:var(--accent-ink);padding:6px 8px}
.btn.tertiary{color:var(--muted);font-weight:600}
.btn.tertiary:hover{background:var(--sunk)}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.danger{background:var(--surface);color:var(--danger);border-color:#e7c6bd}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px;min-height:40px}
.btn .ico{width:16px;height:16px}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 12px;min-height:40px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(31,36,32,.12)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list>li{border-bottom:1px solid var(--line)}
.rowbtn{all:unset;display:grid;gap:6px;width:100%;box-sizing:border-box;padding:15px 2px;cursor:pointer}
.rowbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
.rtitle{font-weight:700;font-size:15px;line-height:1.3}
.rmeta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);font-weight:600;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--ink-2);letter-spacing:.01em}
.tag.green{background:var(--accent-soft);color:#ad2856} .tag.amber{background:var(--amber-soft);color:var(--amber)} .tag.sea{background:var(--sea-soft);color:var(--sea)}
.tag.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.bar{height:4px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.empty{padding:22px 4px;color:var(--muted);font-size:15px}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-weight:400;font-size:17px;margin-bottom:4px}
.detail{padding:2px 2px 18px;display:grid;gap:14px}
.detail p{margin:0;color:var(--ink-2);font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.steps li{display:flex;gap:10px;align-items:center;font-size:15px;padding:5px 0}
.steps li.done span{color:var(--muted)}
.cb{position:relative;width:22px;height:22px;flex:none;border:1.5px solid var(--line-2);border-radius:4px;background:var(--surface);display:grid;place-items:center;padding:0;transition:border-radius .28s cubic-bezier(.4,0,.2,1),background-color .2s,border-color .2s}
/* ticked: the square rounds into a pink circle and the tick draws in; unticked, it eases back to a square */

  background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:var(--r-lg);padding:16px;display:grid;gap:8px;box-shadow:0 18px 40px rgba(0,0,0,.35);transition:opacity .25s}

.cat-n{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}.cat-row .iconbtn{margin:0 -10px 0 0;color:var(--muted)}.cat-row .iconbtn.is-off{opacity:.35}

/* ---------- onboarding ---------- */
.ob{background:var(--paper);z-index:15}

.ob-main{flex:1;min-height:0;overflow:auto;padding:10px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));display:grid;gap:16px;align-content:start}
.ob-foot{display:flex;justify-content:space-between;gap:10px;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}

.ob-dark .ob-list{color:rgba(255,255,255,.85)}
.ob-actions{display:flex;gap:8px;align-items:center}
/* ---------- onboarding, story first. Headings in the app's serif, a size up so whole sentences read easily, the words
   that carry the idea in pink. The idea: pages with a pager and one wide button. Her picture: the world on top, a white panel below. ---------- */
.st-head{display:grid;gap:8px}
.st-h{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.08;letter-spacing:0;margin:0;text-wrap:balance}
.st-h em{font-style:normal;color:var(--accent-ink)}
.st-sub{margin:0;font-size:15px;line-height:1.5;color:#55564f;text-wrap:pretty}
.btn.st-left{justify-self:start;padding-left:0}
.st-note{font-size:13px;font-weight:700;color:var(--muted);min-width:0}.st-note.warn{color:var(--accent-ink)}
.btn.st-big{min-height:54px;border-radius:99px;font-size:17px;flex:1}
.btn.st-dark{background:var(--ink)}
.btn.st-wait{background:#c9a3b2}
.btn.quiet:disabled{opacity:.45}
/* the idea: pages */
.ob.st-idea{background:#faf8f4}
.st-imain{display:flex;flex-direction:column;gap:24px;padding:calc(var(--safe-top) + 44px) 20px 12px}
.st-visual{flex:1;display:grid;place-items:center;min-height:0}
.st-ifoot{display:grid;gap:16px;padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.st-pager{display:flex;justify-content:center;gap:6px}.st-pager i{width:7px;height:7px;border-radius:99px;background:var(--line-2);transition:width .25s,background .25s}.st-pager i.on{width:22px;background:var(--accent)}
.st-ibtns{display:flex;gap:12px;align-items:center}
/* back: a soft round button beside the main one */
.st-back{all:unset;box-sizing:border-box;cursor:pointer;width:54px;height:54px;flex:none;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 1px 2px rgba(31,36,32,.06),0 6px 18px rgba(31,36,32,.10)}
.st-back .ico{width:20px;height:20px}.st-back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.st-pfoot .st-back{width:44px;height:44px}
.st-status{margin:-12px 0 -12px;font-size:13px;font-weight:700;color:var(--muted)}
/* her picture: the world fills the top, the panel holds the choices */
.ob.st-mine{background:var(--night)}
.st-stage{position:relative;flex:1 1 auto;min-height:190px;overflow:hidden;background:var(--night)}
.st-full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block}
.st-stagebar{position:absolute;left:0;right:0;top:0;padding:calc(var(--safe-top) + 18px) 16px 0;display:flex;align-items:center;justify-content:center}
.st-mdots i{background:rgba(255,255,255,.3)}.st-mdots i.on{background:var(--accent)}
.st-panel{flex:none;max-height:70%;display:flex;flex-direction:column;background:#fff;border-radius:24px 24px 0 0;margin-top:-22px;position:relative;box-shadow:0 -12px 30px rgba(0,0,0,.25)}
.st-pmain{display:grid;gap:16px;padding:22px 16px 12px;overflow:auto;align-content:start}
.st-pmain .st-head{text-align:center;justify-items:center}.st-pmain .st-h{font-size:30px}
.st-pfoot{background:#fff;border-top:0;align-items:center;gap:10px}
.btn.st-wide{flex:1;width:100%}
.st-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* the splash */
.ob.st-splash{background:var(--night)}
.ob.st-splash .ob-main{position:relative;padding:0;overflow:hidden;cursor:pointer}
.st-mark{position:absolute;left:0;right:0;bottom:calc(16% + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:6px;color:#fff;text-align:center;opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s;text-shadow:0 2px 12px rgba(10,14,24,.7)}
.st-mark.on{opacity:1;transform:none}
.st-mark b{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1}
.st-mark span{font-size:15px;font-weight:600;color:rgba(255,255,255,.88)}
/* the pictures */
.st-puzzle{width:min(100%,380px);aspect-ratio:280/200;image-rendering:pixelated;display:block;-webkit-mask-image:radial-gradient(ellipse 58% 57% at 50% 50%,#000 52%,transparent 100%);mask-image:radial-gradient(ellipse 58% 57% at 50% 50%,#000 52%,transparent 100%)} /* no board and no box: the picture fades into the page */
.st-world{justify-self:center;width:100%;max-width:400px;height:auto;image-rendering:pixelated;display:block;border-radius:16px;box-shadow:0 6px 18px rgba(31,36,32,.12)}
/* the pieces, unlocked, as jigsaw pieces */
.st-list{list-style:none;margin:0;padding:0;display:grid;gap:14px;width:100%}
.st-list li{display:flex;align-items:center;gap:16px;animation:st-in .5s ease-out both}
.st-list canvas{width:92px;height:92px;flex:none;image-rendering:pixelated}
.st-list .grow{display:grid;gap:4px}.st-list b{font-size:17px}.st-list small{font-size:13px;color:var(--muted);display:flex;align-items:center}
/* the map: milestones → goals → piece → picture */
.st-map{display:flex;align-items:center;justify-content:space-between;gap:2px;margin:-4px 0}
.st-map>.ico{width:12px;height:12px;flex:none;stroke:#cfc8b8;margin-top:-18px}
.st-map span{display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:700;color:#8b8b83;transition:color .3s}
.st-map span i{height:28px;min-width:28px;padding:0 7px;box-sizing:border-box;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1.5px #e3ddd1;display:flex;align-items:center;justify-content:center;gap:3px;transition:background .3s,box-shadow .3s}
.st-map .st-mdots3 b{width:6px;height:6px;border-radius:50%;background:var(--line-2)}

/* =====================================================================
   1. STORE — data model, persistence, migration
   One document per person: profile and avatar, destinations, dreams, goals, entries, reflections

   dream and a destination, entries at goals. A guest's document lives in this browser only. Inside
   claude.ai it also syncs to that person's own record (data/users/<their id>/life), so two people
   never share one. A future account backend only has to replace docRef; nothing else changes.
   ===================================================================== */
const APP_NAME = "Paint a Picture";
const LS_KEY = "dreamLifeBuilder.v1";
const DEFAULT_CATEGORIES = ["Places & travel", "Home & surroundings", "Career & education", "Fitness & wellbeing", "Experiences & adventures", "Money & material", "Skills & growth", "Relationships & lifestyle"];

const ZONE = {home:"home", library:"home", campus:"any", villa:"city", studio:"city", car:"city", drift:"car", fitness:"field", beach:"coast", balloon:"field", garden:"field", picnic:"field", fountain:"any"};
const CAT_KIND = {"Places to live":"villa", "Places & travel":"balloon", "Home & surroundings":"home", "Career & creative work":"studio", "Career & education":"campus", "Fitness & wellbeing":"fitness", "Experiences & adventures":"balloon", "Money & material":"car", "Skills & growth":"library", "Relationships & lifestyle":"picnic"};
const TIMEFRAMES = ["Within 2 years", "2–5 years", "5–10 years", "10–15 years"];
// Where a place sits in her story: lived there before, lives there now, or somewhere she's working towards.
const STAGES = {past: "Lived here before", current: "Live here now", future: "Want to get to"};
// A city's status says where it sits in her story. It decides whether the city's own world is lit (status), which is

const STATUS = {loved: "Done & Loved", current: "Living", futureLiving: "Future Home", study: "Study", office: "Office", business: "Business", travel: "Travel", experience: "Experience", retire: "Retire", marry: "Marry"};

function statusFrom(d){

  d.purpose = {loved: "loved", study: "study", office: "work", business: "work", travel: "experience", experience: "experience"}[st] || "live";

const PURPOSES = {from: "Where I'm from", live: "Live", study: "Study", work: "Work", experience: "Travel", loved: "Done & Loved"};
const TOPS = {white:["#f1eee8","#cfcac0"], pink:["#e3628f","#b9446f"], yellow:["#f2cf5b","#c9a43a"], blue:["#5b8fd6","#3f6aa8"], red:["#d23b3b","#a12a2a"], black:["#3a3438","#242024"]};
const BOTS = {black:["#3a3a40","#26262b"], grey:["#8e9299","#6a6e76"], white:["#eceae4","#c9c6c0"]};
const BOOTS = {black:["#2c2c31","#151518"], grey:["#9a9ea6","#6e727a"], white:["#f2f0ec","#c9c6c0"]};
const SKINS = {fair:["#f1c9a5","#d6a582"], light:["#e2ad85","#c48d66"], tan:["#c98e62","#a8714c"], brown:["#a46a45","#865436"], deep:["#7a4a2f","#5f3922"]};
const HAIRS = {brunette:["#3b2218","#7a4a2a","#a8693a"], black:["#17131a","#3a3040","#5a4a5c"], auburn:["#4a1d14","#8f3f26","#c0643a"], blonde:["#8a6334","#c9a05c","#ecd08e"]};

let S = null;               // the whole state (one document)
let docRef = null, sampleFn = null, assetsApi = null, downloadsApi = null;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

const parseDay = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const $ = id => document.getElementById(id);

function blankState(){
  return {v: 3, onboarded: false, onboarding: {step: 0, done: false}, demo: false,
    profile: {id: uid(), name: "", email: "", horizon: 10, avatar: {...DEFAULT_AVATAR}},
    categories: DEFAULT_CATEGORIES.slice(), destinations: [],
    aspirations: [], goals: [], entries: [], reflections: {}, assetCats: STARTER_ASSET_CATS.map((name, i) => ({id: "ac-" + i, name})), assets: [], notes: [], todos: [], affirmations: [], gratitude: [],
    rewards: {clearViewsUsed: 0}, seenBuilt: []};

function migrate(o){
  if (!o || typeof o !== "object") return blankState();
  if (o.v === 3) return normalize(o);
  if (o.v === 2) return upgradeTo3(normalize(o));
  // Version 1 stored {dreams, wins, goals}. Carry that work forward instead of dropping it.
  const s = blankState(), kindMap = {city: "villa", house: "home", surf: "beach", travel: "balloon", book: "library", star: "fountain", family: "picnic", car: "car", garden: "garden"};
  const catMap = {villa: "Places to live", home: "Home & surroundings", beach: "Experiences & adventures", balloon: "Experiences & adventures", library: "Skills & growth", fountain: "Experiences & adventures", picnic: "Relationships & lifestyle", car: "Money & material", garden: "Home & surroundings"};

function classifyDream(text, cat){
  const words = String(text || "").toLowerCase().match(/[a-z0-9-]+/g) || [], forms = new Set();
  for (const w of words) { forms.add(w); forms.add(w.replace(/(ies)$/, "y")); forms.add(w.replace(/(es|s)$/, "")); forms.add(w.replace(/ing$/, "")); forms.add(w.replace(/ed$/, "")); }

  if (!ranked.length && words.length && CAT_THEME[cat]) ranked.push(themeById(CAT_THEME[cat]));
  return ranked;
}

    ${id && siblings.length > 1 ? `<div class="actions"><button type="button" class="btn ghost sm" id="asUp" ${pos <= 0 ? "disabled" : ""}>Move up</button><button type="button" class="btn ghost sm" id="asDown" ${pos >= siblings.length - 1 ? "disabled" : ""}>Move down</button></div>` : ""}
    <p class="muted" id="asErr" role="alert" style="margin:0;color:var(--danger)" hidden></p>`,
    `${id ? delIcon("asDel") : ""}<button class="btn ghost" id="asCancel">Cancel</button><button class="btn" id="asSave">Save</button>`, () => {
      $("asFile").onchange = async e => { const f = e.target.files[0]; if (!f) return; try { pending = await readImage(f); $("asImg").src = pending.dataUrl; $("asImg").hidden = false; $("asImgRm").hidden = false; $("asImgLbl").textContent = "Replace image"; } catch (err) { toast("That file couldn't be read as an image."); } };

      const c = $("asCancel"); if (c) c.onclick = closeSheet;
      const swap = dir => commit(s => { const sib = s.assets.filter(x => x.catId === a.catId).sort((p, q) => p.order - q.order), i = sib.findIndex(x => x.id === id), j = i + dir; if (i >= 0 && j >= 0 && j < sib.length) [sib[i].order, sib[j].order] = [sib[j].order, sib[i].order]; });
      if ($("asUp")) { $("asUp").onclick = () => { swap(-1); closeSheet(); }; $("asDown").onclick = () => { swap(1); closeSheet(); }; }
      const del = $("asDel"); if (del) del.onclick = () => { if (!armDelete(del)) return; commit(s => { s.assets = s.assets.filter(x => x.id !== id); }); closeSheet(); toast("Asset deleted"); };
      $("asSave").onclick = async () => {
        const title = $("asTitle").value.trim(); if (!title) { $("asErr").textContent = "Give it a name."; $("asErr").hidden = false; $("asTitle").focus(); return; }

/* --- JOURNAL: private notes, reminders and letters to yourself. Not tied to any goal. --- */
let noteFilter = "all", noteQuery = "";

const fmtWhen = at => new Date(at).toLocaleString(undefined, {weekday: "short", day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit"});

  if (journalTab === "good") return renderGood();

    .filter(n => !q || (n.title + " " + n.body).toLowerCase().includes(q)).sort((a, b) => b.at.localeCompare(a.at));

    <div class="phead"><div><div class="ph-left"><button class="iconbtn" data-go="home" aria-label="Back to your world">${ICON_BACK}</button><h1>Journal</h1></div><div class="sub">Notes, good things and affirmations, just for you</div></div><button class="btn quiet" id="newNote">${ICON.plus}New note</button></div>${jTabs()}
    <input type="search" id="noteQ" value="${esc(noteQuery)}" placeholder="Search notes" aria-label="Search notes by title or text">
    <div class="seg" role="group" aria-label="Filter notes" style="justify-self:start">${[["all", `All ${S.notes.length}`], ["pinned", `Pinned ${S.notes.filter(n => n.pinned).length}`], ["fav", `Favourites ${S.notes.filter(n => n.fav).length}`]].map(([k, l]) => `<button aria-pressed="${noteFilter === k}" data-nf="${k}">${l}</button>`).join("")}</div>
    <div id="noteList">${list.length ? `<ul class="list">${list.map(noteRow).join("")}</ul>` : !q && noteFilter === "all" ? "" : `<div class="empty"><b>${q ? "No notes match" : noteFilter === "all" ? "A page of your own" : noteFilter === "pinned" ? "Nothing pinned" : "No favourites yet"}</b>${q ? "Try another word." : noteFilter === "all" ? "Write a thought, a reminder, or a letter to your future self. It doesn't need to be tied to a goal." : "Open a note and pin it or mark it as a favourite."}</div>`}</div>`;

function noteRow(n){

/* --- WEEKLY HISTORY: jump to any week, search everything you've logged --- */
let weekQuery = "";
function weekSearch(q){
  q = q.trim().toLowerCase(); if (q.length < 2) return [];
  const hits = [], has = t => t && t.toLowerCase().includes(q);
  for (const e of S.entries) { const f = [e.text, e.notes, (e.tags || []).join(" "), e.learned, e.blocked, e.next].find(has); if (f) hits.push({ws: weekStart(e.date), date: e.date, kind: e.type === "did" ? "Accomplished" : "Worked on", text: f}); }
  for (const [ws, r] of Object.entries(S.reflections)) { const f = [r.text, r.next].find(has); if (f) hits.push({ws, date: ws, kind: "Weekly review", text: f}); }
  for (const g of S.goals) {
    if (has(g.title)) { const d = g.doneAt || g.deadline; hits.push({ws: weekStart(d), date: d, kind: g.status === "done" ? "Goal finished" : g.status === "cancelled" ? "Goal let go" : "Goal due", text: g.title}); }
    for (const m of g.milestones) if (m.doneAt && has(m.title)) hits.push({ws: weekStart(m.doneAt), date: m.doneAt, kind: "Step done", text: m.title});
  }
  return hits.sort((a, b) => b.date.localeCompare(a.date)).slice(0, 40);
}
const weekRange = ws => `${fmt(ws, {day: "numeric", month: "short"})} – ${fmt(addDays(ws, 6), {day: "numeric", month: "short", year: "numeric"})}`;
function weekHistoryHTML(){
  const hits = weekSearch(weekQuery), byWeek = new Map(); hits.forEach(h => { if (!byWeek.has(h.ws)) byWeek.set(h.ws, []); byWeek.get(h.ws).push(h); });
  return `<div class="wk-search">
    <div class="wk-box"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" id="wQ" value="${esc(weekQuery)}" placeholder="Search your logs by keyword" aria-label="Search past weeks"></div>
    <div id="wResults">${weekQuery.trim().length < 2 ? "" : hits.length ? [...byWeek].map(([ws, list]) => `<button class="wk-hit" data-week="${ws}"><span class="eyebrow">${esc(weekRange(ws))}</span>${list.slice(0, 3).map(h => `<span><b>${esc(h.kind)}</b> ${esc(h.text.length > 90 ? h.text.slice(0, 90) + "…" : h.text)}</span>`).join("")}${list.length > 3 ? `<span class="muted">+${list.length - 3} more</span>` : ""}</button>`).join("") : `<p class="muted" style="margin:0;font-size:13px">Nothing found for “${esc(weekQuery)}”.</p>`}</div></div>`;
}
function wireWeekHistory(){

  $("wQ").oninput = e => { weekQuery = e.target.value; const pos = e.target.selectionStart; renderWeek(); const i = $("wQ"); i.focus(); i.setSelectionRange(pos, pos); };
  document.querySelectorAll("[data-week]").forEach(b => b.onclick = () => { weekOf = b.dataset.week; weekQuery = ""; renderWeek(); $("pmain").scrollTop = 0; });
}

/* --- backup and restore: one JSON file holding everything --- */
function backupData(){
  const images = {};
  for (const a of [...S.aspirations, ...S.assets]) if (a.image && a.image.local) { const d = localImg(a.image.local); if (d) images[a.image.local] = d; }
  return JSON.stringify({app: "paint-a-picture", version: 2, exportedAt: new Date().toISOString(), state: S, images});
}
async function downloadBackup(){
  const btn = $("backupBtn"), filename = `paint-a-picture-backup-${today()}.json`;
  btn.disabled = true;
  const done = () => { S.lastBackup = today(); save(); toast("Backup saved. Keep the file somewhere safe."); renderAccount(); };
  try {
    if (downloadsApi) { await downloadsApi.save({filename, data: backupData()}); done(); }
    else if (window.claude?.use) toast("Downloads aren't available in this view. Open the app in your browser to back up.");
    else { // the standalone copy outside claude.ai
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([backupData()], {type: "application/json"})); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); done();
    }
  } catch (e) { toast(e && e.code === "cancelled" ? "Backup not saved." : "Couldn't save the backup file. Try again."); }
  finally { if ($("backupBtn")) $("backupBtn").disabled = false; }
}
async function restoreBackup(file){
  let parsed = null;
  try { parsed = JSON.parse(await file.text()); } catch (e) {}
  const st = parsed && (parsed.app === "paint-a-picture" || parsed.app === "dream-life") && parsed.state;
  if (!st || !Array.isArray(st.goals) || !Array.isArray(st.entries)) { toast("That file isn't a Paint a Picture backup."); return; }
  const incoming = migrate(st), box = $("restoreConfirm");
  const when = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleDateString(undefined, {day: "numeric", month: "short", year: "numeric"}) : "an earlier date";
  box.innerHTML = `<div><b>Restore the backup from ${esc(when)}?</b> It has ${incoming.aspirations.length} pieces, ${incoming.goals.length} goals and ${incoming.entries.length} entries. It replaces what's here now, so download a backup of the current data first if you might want it.</div>
    <div class="actions"><button class="btn sm" id="restoreYes" type="button">Replace with backup</button><button class="btn sm ghost" id="restoreNo" type="button">Cancel</button></div>`;
  box.hidden = false;
  $("restoreNo").onclick = () => { box.hidden = true; };
  $("restoreYes").onclick = () => {
    for (const [k, v] of Object.entries(parsed.images || {})) { try { localStorage.setItem("dreamLife.img." + k, v); } catch (e) {} }
    S = incoming; S.onboarded = true; S.onboarding.done = true; afterChange(); save();
    toast("Restored. Everything from the backup is back."); renderAccount();
  };
}

const CONSENT_KEY = "dreamLife.consent", ANON_KEY = "dreamLife.anon";
const consent = () => { try { return localStorage.getItem(CONSENT_KEY) || ""; } catch (e) { return ""; } };
function setConsent(v){ try { localStorage.setItem(CONSENT_KEY, v); } catch (e) {} $("consent")?.remove(); if (v === "yes") track("usage_sharing_on"); }
function anonId(){ let id = ""; try { id = localStorage.getItem(ANON_KEY) || ""; if (!id) { id = "anon-" + uid() + uid(); localStorage.setItem(ANON_KEY, id); } } catch (e) { id = "anon-session"; } return id; }
// One anonymous event. Only ids from the app's own lists (piece ids, step names, scenery types) and counts, never her words.
function track(event, props){
  if (!CFG.posthogKey || consent() !== "yes" || demoMode) return;
  const body = {api_key: CFG.posthogKey, event, distinct_id: anonId(), timestamp: new Date().toISOString(),
    properties: Object.assign({app: location.protocol === "paintapicture:" ? "ios" : "web", $process_person_profile: false}, props || {})};
  fetch(CFG.posthogHost + "/i/v0/e/", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body), keepalive: true}).catch(() => {});

function askConsent(){
  if (!CFG.posthogKey || consent()) return;
  const el = document.createElement("div"); el.className = "consent"; el.id = "consent"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Usage sharing");
  el.innerHTML = `<p>Help us make Paint a Picture better? We count which steps people finish, anonymously. Never your name, places, goals or notes.</p>
    <div class="consent-b"><button type="button" class="btn quiet sm" id="consentNo">No thanks</button><button type="button" class="btn sm" id="consentYes">That's fine</button></div>`;
  $("app").appendChild(el);
  $("consentYes").onclick = () => setConsent("yes"); $("consentNo").onclick = () => setConsent("no");

// Usage that happens anywhere in the app is counted here, from what changed in one commit.
function usageCounts(){
  if (!S) return null;
  return {goals: S.goals.length, ms: S.goals.reduce((n, g) => n + (g.milestones || []).filter(m => m.doneAt).length, 0),
    unlocked: S.aspirations.filter(a => { try { return isUnlocked(a); } catch (e) { return false; } }).length, journal: S.notes.length + S.entries.length + S.gratitude.length};
}
function countUsage(b){
  const a = usageCounts(); if (!a || !b) return;
  if (a.goals > b.goals) track("goal_created");
  if (a.ms > b.ms) track("milestone_ticked");
  if (a.unlocked > b.unlocked) track("piece_unlocked");
  if (a.journal > b.journal) track("journal_entry_saved");
}

  try { const url = URL.createObjectURL(new Blob([JSON.stringify(w, null, 1)], {type: "application/json"})), a = document.createElement("a"); a.href = url; a.download = `paint-a-picture-other-world-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); } catch (e) {}
}
const SUPA_LIB = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"; // a version that understands publishable keys
function loadScript(src){ return new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); }); }
async function accountsInit(){
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey || window.claude?.use) return; // inside claude.ai the Claude account already syncs
  try { await loadScript(SUPA_LIB); } catch (e) { return; }
  supa = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth: {persistSession: true, storageKey: "dreamLife.auth"}});
  const {data} = await supa.auth.getSession();
  if (data?.session?.user) { supaUser = data.session.user; await syncWithAccount(supaUser); }

// Which world to keep when she signs in: the one on this device, the one in her account, or ask her.
function isEmptyWorld(w){ return !w || (!w.onboarding?.done && !(w.destinations || []).length && !(w.aspirations || []).length && !(w.goals || []).length && !(w.notes || []).length); }
// Where this device and her account last agreed: when the account's copy was saved, and a fingerprint of the world then.
// Comparing both sides with that tells which one changed since, so the right one wins without asking.
const SYNC_KEY = "dreamLife.sync";
function fingerprint(w){ const t = JSON.stringify(w); let a = 0xdeadbeef, b = 0x41c6ce57;
  for (let i = 0; i < t.length; i++) { const c = t.charCodeAt(i); a = Math.imul(a ^ c, 2654435761); b = Math.imul(b ^ c, 1597334677); }
  a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909); b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909);
  return (b >>> 0).toString(36) + (a >>> 0).toString(36); }
const syncMark = () => { try { return JSON.parse(localStorage.getItem(SYNC_KEY) || "null"); } catch (e) { return null; } };
function setSyncMark(user, at, w){ try { localStorage.setItem(SYNC_KEY, JSON.stringify({user: user.id, at, fp: fingerprint(w)})); } catch (e) {} }
// "same": nothing to do; "local": send this device's world up; "remote": bring the account's down; "ask": both changed.
function chooseWorld(local, remote, updatedAt, user){
  if (!remote) return "local";
  if (fingerprint(local) === fingerprint(remote)) return "same";
  const m = syncMark(), known = m && m.user === user.id;
  if (known && m.at === updatedAt) return "local";                // only this device changed since they last agreed
  if (known && m.fp === fingerprint(local)) return "remote";      // only the account changed (another device)
  if (isEmptyWorld(local)) return "remote";
  if (isEmptyWorld(remote)) return "local";
  return "ask";                                                   // both changed, or a new device with its own world
}
async function connectAccount(user){ supaUser = user; await syncWithAccount(user); track("account_signed_in"); }
// Run when she signs in, when the app opens signed in, and whenever she comes back to it.
let syncing = false;
async function syncWithAccount(user){
  if (syncing || !supa) return; syncing = true;
  try {
    try { const {data: fresh} = await supa.auth.getUser(); if (fresh?.user) { user = fresh.user; supaUser = fresh.user; } } catch (e) {} // fresh, so access changes show up
    if (demoMode && !demoAllowed()) await setDemoMode(false);
    const {data: row, error} = await supa.from("worlds").select("data, updated_at").eq("user_id", user.id).maybeSingle();
    if (error) return; // offline: keep working on this device; it catches up next time
    const local = demoMode ? REAL : S, remote = row ? migrate(row.data) : null;
    const use = w => { if (demoMode) { REAL = w; try { localStorage.setItem(LS_KEY, JSON.stringify(w)); } catch (e) {} } else { S = w; try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} if (typingInPage()) pendingRender = true; else afterChange(); if (S.onboarding.done && route === "onboard") go("home"); } };
    const upload = async () => { const w = JSON.parse(JSON.stringify(demoMode ? REAL : S)), r = await worldRow(user, w); if (!r.error) setSyncMark(user, r.at, w); };
    const start = () => { docRef = {set: async d => { const r = await worldRow(user, d); if (r.error) throw r.error; setSyncMark(user, r.at, d); },
      savedNote: "Synced to your account. Only you can see it.", afterSave: () => { lastSynced = new Date().toISOString(); }}; storageNote = docRef.savedNote; if (route === "account") renderAccount(); };
    const pick = chooseWorld(local, remote, row?.updated_at, user);
    if (pick === "same") { setSyncMark(user, row.updated_at, local); start(); }
    else if (pick === "remote") { use(remote); setSyncMark(user, row.updated_at, remote); start(); }
    else if (pick === "local") { await upload(); start(); }
    else {
      const n = (k, one) => `${k} ${one}${k === 1 ? "" : "s"}`, sum = w => `${n((w.destinations || []).length, "place")}, ${n((w.aspirations || []).length, "piece")}, ${n((w.goals || []).length, "goal")}`;
      openSheet("Which world do you want?", `<p style="margin:0">Your account and this device each have changes. Pick the one to keep on both. The other is kept on this device, and you can download it from Account.</p>
        <div class="cklist"><div class="notice"><b>On this device</b><br>${esc(sum(local))}</div><div class="notice"><b>In your account</b><br>${esc(sum(remote))}${row?.updated_at ? ` · saved ${esc(fmt(row.updated_at.slice(0, 10)))}` : ""}</div></div>`,
        `<button class="btn ghost" id="wKeepRemote">Use my account's</button><button class="btn" id="wKeepLocal">Use this device's</button>`, () => {
          const keep = async which => { keepOtherWorld(which === "local" ? remote : local);
            if (which === "remote") { use(remote); setSyncMark(user, row.updated_at, remote); } else await upload(); start(); closeSheet(); toast("Your world is synced. The other one is kept on this device."); };
          $("wKeepRemote").onclick = () => keep("remote"); $("wKeepLocal").onclick = () => keep("local"); });
    }
  } finally { syncing = false; }
}
// Coming back to the app picks up anything saved from another device in the meantime.
document.addEventListener("visibilitychange", () => { if (!document.hidden && supaUser && !saving && $("sheet").hidden) syncWithAccount(supaUser); });
// Save her world as one row, labelled with her name and email so it's easy to find in the dashboard. If those two columns
// haven't been added yet (supabase/schema.sql), it saves without them rather than failing.
let rowLabels = true;
async function worldRow(user, d){
  const at = new Date().toISOString(), row = {user_id: user.id, data: d, updated_at: at};
  if (rowLabels) { const r = await supa.from("worlds").upsert({...row, name: (d.profile?.name || "").slice(0, 80) || null, email: user.email || null});
    if (!r.error || !/column/i.test(r.error.message || "")) return {error: r.error, at}; rowLabels = false; }
  const r = await supa.from("worlds").upsert(row); return {error: r.error, at};
}
// Deletes her account in Supabase (her saved world and her sign-in), then this device's copy. Nothing on the device is
// touched unless the account is gone first, so a failed request never leaves her half-deleted.
async function deleteAccount(){
  const btn = $("popupOk"); if (btn) btn.disabled = true;
  const {data, error} = await supa.functions.invoke("delete-account", {method: "POST"});
  if (error || !data?.deleted) { if (btn) btn.disabled = false; toast("Couldn't delete your account. Check your connection and try again."); return; }
  track("account_deleted");
  try { await supa.auth.signOut(); } catch (e) {}
  supaUser = null; docRef = null; storageNote = "Saved in this browser.";
  try { localStorage.removeItem(SYNC_KEY); localStorage.removeItem("dreamLife.otherWorld"); } catch (e) {}
  S = blankState(); afterChange(); save(); toast("Your account and everything in it is deleted"); startOnboarding(0);
}
async function signOutAccount(){ if (supa) await supa.auth.signOut(); supaUser = null; docRef = null; try { localStorage.removeItem(SYNC_KEY); } catch (e) {} storageNote = "Saved in this browser."; renderAccount(); toast("Signed out. Your world stays on this device."); }
// The account panel on the Account page: sign in with a code, or see who's signed in.
// Email → code → signed in. root gets the form; onDone runs once she's in and her world is connected.
function signInForm(root, onDone){
  root.innerHTML = `<div class="st-signstep"><label class="field"><span>Email</span><input type="email" id="signEmail" autocomplete="email" inputmode="email" placeholder="you@example.com"></label>
    <button class="btn" id="signSend" type="button" style="justify-self:start">Email me a code</button></div><p class="muted" id="signErr" role="alert" style="margin:0;color:var(--danger)" hidden></p>`;
  const err = t => { $("signErr").textContent = t; $("signErr").hidden = !t; };
  $("signSend").onclick = async () => {
    const email = $("signEmail").value.trim(); if (!/^\S+@\S+\.\S+$/.test(email)) { err("Enter your email address."); return; }
    $("signSend").disabled = true; await accountsReadyP; if (!supa) { $("signSend").disabled = false; err("Signing in isn't available right now. Try again in a moment."); return; }
    const {error} = await supa.auth.signInWithOtp({email}); $("signSend").disabled = false;
    if (error) { err("Couldn't send the code. Check the address and try again."); return; } err("");
    root.querySelector(".st-signstep").innerHTML = `<p style="margin:0">We sent a code to <b>${esc(email)}</b>. It can take a minute, and may land in spam.</p>
      <label class="field"><span>The code from your email</span><input type="text" id="signCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10"></label>
      <button class="btn" id="signVerify" type="button" style="justify-self:start">Sign in</button>`;
    $("signCode").focus();
    $("signVerify").onclick = async () => { $("signVerify").disabled = true; const {data, error: e2} = await supa.auth.verifyOtp({email, token: $("signCode").value.trim(), type: "email"}); $("signVerify").disabled = false;
      if (e2 || !data?.user) { err("That code didn't work. Check it, or send a new one."); return; } await connectAccount(data.user); onDone && onDone(); };
  };
}
// Her photo: picked from her phone, cropped square and kept small (it's saved with her world).
function pickPhoto(done){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
  inp.onchange = () => { const f = inp.files && inp.files[0]; if (!f) return; const url = URL.createObjectURL(f), im = new Image();
    im.onload = () => { const c = document.createElement("canvas"), n = 320, k = Math.min(im.width, im.height); c.width = c.height = n;
      c.getContext("2d").drawImage(im, (im.width - k) / 2, (im.height - k) / 2, k, k, 0, 0, n, n); URL.revokeObjectURL(url);
      S.profile.photo = c.toDataURL("image/jpeg", .82); save(); done && done(); track("photo_added"); };
    im.onerror = () => { URL.revokeObjectURL(url); toast("That photo couldn't be opened. Try another one."); }; im.src = url; };
  inp.click();
}
const photoHTML = () => S.profile.photo ? `<img src="${esc(S.profile.photo)}" alt="Your photo">` : `<span aria-hidden="true">${ICON.plus}</span><small>Photo</small>`;
const fullName = () => [S.profile.name, S.profile.middleName, S.profile.lastName].map(x => (x || "").trim()).filter(Boolean).join(" ");
const demoAllowed = () => !!supaUser?.app_metadata?.demo_access || !CFG.supabaseUrl;
const AC_PIN = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z" fill="none" stroke-width="2"/><circle cx="12" cy="10" r="2.2" stroke="none"/></svg>';
// A centred pop-up: a title, one line, and Cancel beside the action. onOk may return a promise; it closes when that ends.
function popup(title, text, okLabel, onOk){
  $("popup")?.remove();
  const el = document.createElement("div"); el.className = "popup-scrim"; el.id = "popup";
  el.innerHTML = `<div class="popup" role="alertdialog" aria-modal="true" aria-labelledby="popupT" aria-describedby="popupD"><h2 id="popupT">${esc(title)}</h2><p id="popupD">${esc(text)}</p>
    <div class="popup-b"><button class="btn ghost" id="popupNo" type="button">Cancel</button><button class="btn" id="popupOk" type="button">${esc(okLabel)}</button></div></div>`;
  $("app").appendChild(el);

// Guests can add places and pieces. Everything else is saved to an account, so it asks them to sign in first.
const isGuest = () => !!CFG.supabaseUrl && !supaUser && !demoMode && !window.claude?.use;
function needAccount(then){

function accountPanel(){
