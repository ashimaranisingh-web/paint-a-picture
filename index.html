<!doctype html>
<html lang="en">
<head>
<title>Paint a Picture</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
</head>
<body>
<style>
/* Layout: phone-shaped app. Home = a dark, immersive pixel world with glass controls (mark top-left, menu top-right, Goals / This week at the bottom).
   Product screens = warm light paper, editorial serif titles, compact ruled lists, bottom sheets for editing. */
:root{
  --safe-top:env(safe-area-inset-top,0px); /* the notch / Dynamic Island; the desktop iPhone 14 frame uses 47px */
  --paper:#f7f4ee; --surface:#fffdf9; --sunk:#f0ece3;
  --ink:#1f2420; --ink-2:#474c46; --muted:#686961; --line:#e6e0d4; --line-2:#d6cfbf;
  --accent:#f04f85; --accent-strong:#cf3367; --accent-2:#b82a5a; --accent-ink:#c22f60; --accent-soft:#fde8ef;
  --amber:#8f5c14; --amber-soft:#f5ead6; --sea:#2c6a88; --sea-soft:#e2edf2; --danger:#9b3b2a;
  --night:#0f1420; --glass:rgba(16,19,27,.84); --glass-line:rgba(255,255,255,.14);
  --serif:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans:"Manrope", "Helvetica Neue", system-ui, sans-serif;
  --r-sm:8px; --r:12px; --r-lg:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}
#app{height:100%;max-width:390px;margin:0 auto;position:relative;overflow:hidden;background:var(--paper)}
/* On a computer the app is shown at iPhone 14 size (390 × 844), centred; on a phone it fills the screen. */
@media (min-width:560px){#app{box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(31,36,32,.14)}}
@media (min-width:560px) and (min-height:880px){body{display:grid;place-items:center}#app{width:390px;height:844px;border-radius:28px;--safe-top:47px}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- home ---------- */
.home{background:var(--night);color:#fff}
#stage{position:absolute;inset:0}
#scene{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
#scene:focus-visible{outline:none}
.home-top{position:absolute;inset:0 0 auto;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(var(--safe-top) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.home-top>*{pointer-events:auto}
.mark{display:grid;gap:1px;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.mark-name{font-size:13px;font-weight:600;line-height:1.2;color:rgba(255,255,255,.78);letter-spacing:.02em}
.mark-app{font-family:var(--sans);font-size:13px;font-weight:600;color:rgba(255,255,255,.78);letter-spacing:.01em}
.mark-sub{font-family:var(--serif);font-size:24px;line-height:1.1;color:#fff;letter-spacing:.005em}
.gbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;border:1px solid var(--glass-line);background:var(--glass);color:#fff;
  }
.gbtn:hover{background:rgba(30,36,48,.75)}
.gbtn,.pbtn{position:relative}
body.demo-on [data-menu]::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px rgba(16,19,27,.6)}
.home-chips{position:absolute;top:calc(var(--safe-top) + 66px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:5;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip-g{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;border-radius:99px;border:1px solid var(--glass-line);background:var(--glass);color:#fff;
  font-size:13px;font-weight:700;padding:6px 11px;}
.chip-g.gold{background:rgba(232,196,110,.92);color:#2b2108;border-color:transparent}
.chip-g .ico{width:14px;height:14px}
.chip-g.eye{width:44px;height:44px;padding:0;justify-content:center}.chip-g.eye .ico{width:20px;height:20px}
.mapctl{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:5;display:grid;gap:1px;border-radius:14px;overflow:hidden;
  border:1px solid var(--glass-line);background:var(--glass-line);}
.mapctl button{width:44px;height:44px;display:grid;place-items:center;border:0;background:var(--glass);color:#fff}
.mapctl button:hover{background:rgba(30,36,48,.8)}
.mapctl .ico{width:17px;height:17px}
.mapctl button.eye .ico{width:20px;height:20px}
.mapctl button.eye.ready,.mapctl button.eye.open{background:rgba(232,196,110,.92);color:#2b2108}.mapctl button.eye.ready:hover{background:#e8c46e}
.mapctl button.eye.off{color:rgba(255,255,255,.4)}
.eye-open,.eye-shut{transform-origin:12px 12px;transition:transform .45s ease,opacity .3s ease}
.eye .eye-open{transform:scaleY(.08);opacity:0}.eye.open .eye-open{transform:none;opacity:1}.eye.open .eye-shut{opacity:0;transform:scaleY(.4)}
@media (prefers-reduced-motion:reduce){.eye-open,.eye-shut{transition:none}}
.home-tabs{position:absolute;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:10px;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.htab{display:flex;align-items:center;justify-content:center;gap:9px;height:54px;border-radius:16px;border:1px solid var(--glass-line);background:var(--glass);color:#fff;
  font-weight:700;font-size:15px;letter-spacing:.01em;}
.htab:hover{background:rgba(30,36,48,.8)}
.htab.main{background:rgba(247,244,238,.95);color:var(--ink);border-color:transparent}
.loccard{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:6;
  background:rgba(247,244,238,.97);color:var(--ink);border-radius:var(--r-lg);padding:14px 14px 12px;display:grid;gap:8px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.loccard .row{display:flex;gap:12px;align-items:flex-start}
.loccard h3{font-family:var(--serif);font-weight:400;font-size:14px;line-height:1.2;margin:0}
.lc-open{all:unset;cursor:pointer;flex:1;min-width:0;display:grid;gap:4px;padding:4px 0}.lc-open:focus-visible{outline:2px solid var(--accent);border-radius:8px}
.lc-open .clar-bar{margin-top:4px}

.loccard .meta{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.loccard p{margin:0;font-size:13px;color:var(--ink-2)}
.loccard .thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:none;background:var(--sunk)}
.loccard .x{margin-left:auto}
.lc-hint{display:block;margin-top:6px;font-size:11px;color:var(--muted);font-weight:600}
.clar{display:grid;gap:5px}
.clar-bar{height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.clar-bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.clar-txt{font-size:13px;color:var(--muted);font-weight:600}
.bubble{position:absolute;z-index:6;transform:translate(-50%,-100%);background:rgba(247,244,238,.97);color:var(--ink);border-radius:12px;padding:7px 11px;
  font-size:13px;font-weight:600;max-width:220px;text-align:center;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:rgba(247,244,238,.97);border-bottom:0}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--glass);border:1px solid var(--glass-line);
  color:rgba(255,255,255,.9);font-size:13px;font-weight:600;padding:7px 12px;border-radius:99px;white-space:nowrap;pointer-events:none;}
.journey{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:5;
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:30px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-line);padding:0 6px}
.journey::before{content:"";position:absolute;left:18px;right:18px;top:50%;height:1px;background:rgba(255,255,255,.22)}
.journey button{all:unset;cursor:pointer;position:relative;z-index:1;text-align:center;font-size:11px;font-weight:700;letter-spacing:.02em;color:rgba(255,255,255,.62);padding:6px 0}
.journey button[aria-current="true"]{color:#ff8db3}
.journey button:focus-visible{outline:2px solid var(--accent);border-radius:8px}
.journey .you{position:absolute;bottom:4px;height:2px;width:0;border-radius:2px;background:var(--accent);box-shadow:0 0 6px rgba(240,79,133,.6);transition:left .6s cubic-bezier(.4,0,.2,1),width .6s cubic-bezier(.4,0,.2,1);pointer-events:none}
.vision-banner{position:absolute;left:50%;top:calc(var(--safe-top) + 70px);transform:translateX(-50%);z-index:6;background:rgba(247,244,238,.97);color:var(--ink);border-radius:99px;padding:8px 14px;
  font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.3)}

/* ---------- product pages ---------- */
.pages{background:var(--paper)}
.iconbtn{all:unset;cursor:pointer;box-sizing:border-box;width:44px;height:44px;display:grid;place-items:center;margin-left:-12px;border-radius:12px;color:var(--ink);flex:none}
.iconbtn:hover{background:var(--sunk)}.iconbtn:focus-visible{outline:2px solid var(--accent-strong);outline-offset:-2px}
.pmain{padding-top:var(--safe-top)}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--paper)}
.brand{all:unset;cursor:pointer;display:flex;align-items:center;min-height:44px;font-family:var(--serif);font-size:20px;line-height:1}
.pbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.pbtn:hover{background:var(--sunk)}
.pmain{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.page{padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));display:grid;gap:20px;align-content:start}
.pnav{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.pnav button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:3px;padding:9px 0 10px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.pnav button[aria-current="page"]{color:var(--accent-ink)}
.pnav button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.phead h1{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1;margin:0;letter-spacing:-.005em}
.phead .sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}
/* page headers stay put while the page scrolls under them */
.page>.phead{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin:-16px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:16px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h2.sec{font-family:var(--serif);font-weight:400;font-size:20px;margin:0;line-height:1.1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border:1px solid transparent;border-radius:var(--r);padding:10px 15px;font-weight:700;font-size:15px;background:var(--accent-strong);color:#fff;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.quiet{background:transparent;color:var(--accent-ink);padding:6px 8px}
.btn.tertiary{color:var(--muted);font-weight:600}
.btn.tertiary:hover{background:var(--sunk)}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.danger{background:var(--surface);color:var(--danger);border-color:#e7c6bd}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px;min-height:40px}
.btn .ico{width:16px;height:16px}
.seg{display:inline-flex;background:var(--sunk);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 12px;min-height:40px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(31,36,32,.12)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list>li{border-bottom:1px solid var(--line)}
.rowbtn{all:unset;display:grid;gap:6px;width:100%;box-sizing:border-box;padding:15px 2px;cursor:pointer}
.rowbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
.rtitle{font-weight:700;font-size:15px;line-height:1.3}
.rmeta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);font-weight:600;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--ink-2);letter-spacing:.01em}
.tag.green{background:var(--accent-soft);color:#ad2856} .tag.amber{background:var(--amber-soft);color:var(--amber)} .tag.sea{background:var(--sea-soft);color:var(--sea)}
.tag.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.bar{height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.empty{padding:22px 4px;color:var(--muted);font-size:15px}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-weight:400;font-size:17px;margin-bottom:4px}
.detail{padding:2px 2px 18px;display:grid;gap:14px}
.detail p{margin:0;color:var(--ink-2);font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.steps li{display:flex;gap:10px;align-items:center;font-size:15px;padding:5px 0}
.steps li.done span{color:var(--muted);text-decoration:line-through}
.cb{position:relative;width:22px;height:22px;flex:none;border:1.5px solid var(--line-2);border-radius:6px;background:var(--surface);display:grid;place-items:center;padding:0}
.cb::before{content:"";position:absolute;inset:-11px}
.cb[aria-checked="true"]{background:var(--accent-strong);border-color:var(--accent-strong)}
.cb[aria-checked="true"]::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.notice{border-radius:var(--r);background:var(--amber-soft);padding:12px 13px;display:grid;gap:10px;font-size:13px;color:#5d4316}
.notice b{color:#3d2c0c}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.history{font-size:13px;color:var(--muted);display:grid;gap:3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.stats div{padding:12px 6px;text-align:center;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-family:var(--serif);font-weight:400;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.panel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px;display:grid;gap:8px}
.insight{font-size:15px;color:var(--ink-2);display:grid;gap:6px}
.insight div{display:flex;gap:9px}
.insight div::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px}
.weeknav{display:flex;align-items:center;gap:6px}
.wk-strip{display:grid;gap:2px;margin-top:-8px}.wk-mrow{display:flex;align-items:center;margin-left:-8px}
.wk-arrow{all:unset;cursor:pointer;display:grid;place-items:center;width:32px;height:44px;color:var(--muted);border-radius:10px}.wk-arrow:hover{background:var(--sunk)}.wk-arrow:disabled{opacity:.3;cursor:default;background:none}.wk-arrow .ico{width:16px;height:16px}
.wk-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.wk-month{font-size:15px;font-weight:400;color:var(--ink-2);min-width:56px;text-align:center}
.wk-day{display:grid;gap:2px;padding:6px 0;border-radius:10px}.wk-day small{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}.wk-day b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.wk-day.today{background:var(--sunk)}.wk-day.today b{color:var(--accent-ink)}
.entry{display:grid;gap:8px}
.entry .t{font-size:15px;font-weight:600}
.entry .refl{font-size:13px;color:var(--ink-2);display:grid;gap:2px}
.entry .refl span b{color:var(--muted);font-weight:700}
.asp{display:flex;gap:13px;align-items:center}
.asp canvas,.asp img{width:56px;height:56px;border-radius:12px;flex:none;object-fit:cover;image-rendering:pixelated;background:#6f9c4a}
.asp .grow{min-width:0;flex:1;display:grid;gap:4px}
.asp .d{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* forms + sheet */
.field{display:grid;gap:8px}
.field>span{font-size:13px;font-weight:700;color:var(--ink-2)}
.field small{font-size:13px;color:var(--muted)}
input[type=text],input[type=search],input[type=email],input[type=url],input[type=date],input[type=datetime-local],input[type=number],select,textarea{width:100%;min-width:0;border:0;border-bottom:1.5px solid var(--line-2);border-radius:0;background:transparent;padding:11px 2px;font-size:16px;font-weight:500;line-height:1.35}
textarea{resize:vertical;min-height:84px}
textarea.fit{resize:none;min-height:0;overflow:hidden}
.add-ic{color:var(--accent-ink)}
.pl-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:4px 6px 4px 14px;display:grid}
.pl-row{display:flex;align-items:center;gap:8px;min-height:56px}.pl-t{flex:1;min-width:0;display:grid;gap:2px;font-size:15px;font-weight:600}.pl-t small{font-size:13px;font-weight:500;color:var(--muted)}
.pl-pics{display:grid;border-top:1px solid var(--line);margin-right:8px}
.pl-pic{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:500}.pl-pic:last-child{border-bottom:0}
.pl-pic .grow{flex:1;min-width:0}.pl-pic .dc-thumb{width:40px;height:40px}.pl-pic:focus-visible{outline:2px solid var(--accent);border-radius:8px}
input::placeholder,textarea::placeholder{color:#8b8b83}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--accent-strong);box-shadow:0 1px 0 var(--accent-strong)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scrim{position:absolute;inset:0;background:rgba(20,22,20,.38);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:92%;display:flex;flex-direction:column;background:#fff;color:var(--ink);border-radius:22px 22px 0 0;
  box-shadow:0 -20px 60px rgba(0,0,0,.25);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:.4}}

<script>
"use strict";
/* =====================================================================
   1. STORE — data model, persistence, migration
   One document per person: profile and avatar, destinations, dreams, goals, entries, reflections
   and onboarding progress. Every record has a stable id; dreams point at a destination, goals at a
   dream and a destination, entries at goals. A guest's document lives in this browser only. Inside
   claude.ai it also syncs to that person's own record (data/users/<their id>/life), so two people
   never share one. A future account backend only has to replace docRef; nothing else changes.
   ===================================================================== */
const APP_NAME = "Paint a Picture";
const LS_KEY = "dreamLifeBuilder.v1";
const DEFAULT_CATEGORIES = ["Places & travel", "Home & surroundings", "Career & education", "Fitness & wellbeing", "Experiences & adventures", "Money & material", "Skills & growth", "Relationships & lifestyle"];
const KINDS = {villa:"Modern villa", home:"Home", studio:"Studio", campus:"University hall", car:"Car & driveway", drift:"Drift circuit", fitness:"Running track & gym", beach:"Beach & surf", balloon:"Hot-air balloon", garden:"Garden", picnic:"Picnic lawn", library:"Library", fountain:"Fountain plaza"};
const ZONE = {home:"home", library:"home", campus:"any", villa:"city", studio:"city", car:"city", drift:"car", fitness:"field", beach:"coast", balloon:"field", garden:"field", picnic:"field", fountain:"any"};
const CAT_KIND = {"Places to live":"villa", "Places & travel":"balloon", "Home & surroundings":"home", "Career & creative work":"studio", "Career & education":"campus", "Fitness & wellbeing":"fitness", "Experiences & adventures":"balloon", "Money & material":"car", "Skills & growth":"library", "Relationships & lifestyle":"picnic"};
const TIMEFRAMES = ["Within 2 years", "2–5 years", "5–10 years", "10–15 years"];
// Where a place sits in her story: lived there before, lives there now, or somewhere she's working towards.
const STAGES = {past: "Lived here before", current: "Live here now", future: "Want to get to"};
const PURPOSES = {from: "Where I'm from", live: "Live", study: "Study", work: "Work", visit: "Visit", experience: "Travel"};
const TOPS = {white:["#f1eee8","#cfcac0"], pink:["#e3628f","#b9446f"], yellow:["#f2cf5b","#c9a43a"], blue:["#5b8fd6","#3f6aa8"], red:["#d23b3b","#a12a2a"], black:["#3a3438","#242024"]};
const BOTS = {black:["#3a3a40","#26262b"], grey:["#8e9299","#6a6e76"], white:["#eceae4","#c9c6c0"]};
const BOOTS = {black:["#2c2c31","#151518"], grey:["#9a9ea6","#6e727a"], white:["#f2f0ec","#c9c6c0"]};
const SKINS = {fair:["#f1c9a5","#d6a582"], light:["#e2ad85","#c48d66"], tan:["#c98e62","#a8714c"], brown:["#a46a45","#865436"], deep:["#7a4a2f","#5f3922"]};
const HAIRS = {brunette:["#3b2218","#7a4a2a","#a8693a"], black:["#17131a","#3a3040","#5a4a5c"], auburn:["#4a1d14","#8f3f26","#c0643a"], blonde:["#8a6334","#c9a05c","#ecd08e"]};
const DEFAULT_AVATAR = {style: "pixel", look: "girl", skin: "tan", hair: "brunette", top: "pink", bot: "grey", boots: "white", glasses: true, cap: false, capColor: "black"};

let S = null;               // the whole state (one document)
let docRef = null, sampleFn = null, assetsApi = null, downloadsApi = null;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => ymd(new Date());
const parseDay = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

const dayDiff = (a, b) => Math.round((parseDay(a) - parseDay(b)) / 86400000);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const $ = id => document.getElementById(id);

function blankState(){
  return {v: 3, onboarded: false, onboarding: {step: 0, done: false}, demo: false,
    profile: {id: uid(), name: "", email: "", horizon: 10, avatar: {...DEFAULT_AVATAR}},
    categories: DEFAULT_CATEGORIES.slice(), destinations: [],
    aspirations: [], goals: [], entries: [], reflections: {}, assetCats: STARTER_ASSET_CATS.map((name, i) => ({id: "ac-" + i, name})), assets: [], notes: [],
    rewards: {clearViewsUsed: 0}, seenBuilt: []};
}
function migrate(o){
  if (!o || typeof o !== "object") return blankState();
  if (o.v === 3) return normalize(o);
  if (o.v === 2) return upgradeTo3(normalize(o));
  // Version 1 stored {dreams, wins, goals}. Carry that work forward instead of dropping it.
  const s = blankState(), kindMap = {city: "villa", house: "home", surf: "beach", travel: "balloon", book: "library", star: "fountain", family: "picnic", car: "car", garden: "garden"};
  const catMap = {villa: "Places to live", home: "Home & surroundings", beach: "Experiences & adventures", balloon: "Experiences & adventures", library: "Skills & growth", fountain: "Experiences & adventures", picnic: "Relationships & lifestyle", car: "Money & material", garden: "Home & surroundings"};
  (o.dreams || []).forEach(d => { const k = kindMap[d.kind] || "fountain"; s.aspirations.push({id: d.id, title: d.name, desc: "", category: catMap[k], kind: k, timeframe: "10–15 years", createdAt: today()}); });
  (o.goals || []).forEach(g => s.goals.push({id: g.id, title: g.title, desc: "", aspirationId: null, start: g.created || today(), deadline: g.deadline, priority: "", status: g.doneAt ? "done" : "active", doneAt: g.doneAt || null, milestones: [], deadlineHistory: [], createdAt: g.created || today()}));
  (o.wins || []).forEach(w => s.entries.push({id: w.id, date: w.date, text: w.text, type: "did", goalIds: w.goalId ? [w.goalId] : [], size: (w.pts || 10) >= 40 ? 3 : (w.pts || 10) >= 20 ? 2 : 1, learned: "", blocked: "", next: ""}));
  if (o.name) s.profile.name = o.name;
  if (o.horizon) s.profile.horizon = o.horizon;
  s.onboarded = !!(s.aspirations.length || s.goals.length || s.entries.length);
  return upgradeTo3(normalize(s));
}
function normalize(o){
  const s = Object.assign(blankState(), o), b = blankState();
  s.profile = Object.assign(b.profile, o.profile || {});
  const out = s.profile.outfit || {};
  s.profile.avatar = Object.assign({...DEFAULT_AVATAR}, out.top ? {top: out.top, bot: out.bot} : {}, s.profile.avatar || {});
  const av = s.profile.avatar;
  if (!TOPS[av.top]) av.top = {ivory: "white", blush: "pink"}[av.top] || "pink"; if (!BOTS[av.bot]) av.bot = {sand: "white"}[av.bot] || "grey"; if (!BOOTS[av.boots]) av.boots = "white"; if (!SKINS[av.skin]) av.skin = "tan"; if (!HAIRS[av.hair]) av.hair = "brunette";
  av.cap = !!av.cap; if (!TOPS[av.capColor]) av.capColor = "black";
  av.style = "pixel"; if (!LOOKS[av.look]) av.look = av.look === "masculine" ? "boy" : "girl";
  delete s.profile.outfit;
  s.onboarding = Object.assign({step: 0, done: false}, o.onboarding || {});
  s.rewards = Object.assign({clearViewsUsed: 0}, o.rewards || {});
  s.destinations = (s.destinations || []).filter(d => d && d.id);
  // the original five keep their order (Mumbai, Delhi, Boston, LA, Japan) and LA is called LA
  const ORDER = ["d-mumbai", "d-delhi", "d-boston", "d-la", "d-japan"], rank = d => { const i = ORDER.indexOf(d.id); return i < 0 ? 99 : i; };
  if (ORDER.every(id => s.destinations.some(d => d.id === id))) s.destinations = s.destinations.map((d, i) => [d, i]).sort((a, b) => (rank(a[0]) - rank(b[0])) || (a[1] - b[1])).map(x => x[0]);
  s.destinations.forEach(d => { if (d.id === "d-la" && d.name === "Los Angeles") d.name = "LA"; });
  addTaglines(s);
  s.destinations.forEach(d => { if (!STAGES[d.stage]) d.stage = d.purpose === "from" ? "past" : d.id === "dm-delhi" ? "current" : "future"; }); // the demo lives in Delhi
  s.revealSeen = o.revealSeen && typeof o.revealSeen === "object" ? o.revealSeen : null;
  s.destinations.forEach(d => { if (d.landmark === undefined || (d.landmark !== "none" && !landmarkOptions(d).includes(d.landmark))) d.landmark = defaultLandmark(d, s.aspirations || []); });
  s.goals.forEach(g => { g.milestones ||= []; g.deadlineHistory ||= []; g.status ||= "active"; if (!Array.isArray(g.aspirationIds)) g.aspirationIds = g.aspirationId ? [g.aspirationId] : []; g.aspirationId = g.aspirationIds[0] || null; });
  s.entries.forEach(e => { e.goalIds ||= []; });
  if (!Array.isArray(o.assetCats)) s.assetCats = STARTER_ASSET_CATS.map((name, i) => ({id: "ac-" + i, name}));
  s.assets = Array.isArray(o.assets) ? o.assets : []; s.notes = Array.isArray(o.notes) ? o.notes : [];
  s.assets.forEach((a, i) => { a.tags ||= []; if (a.order == null) a.order = i; if (!ASSET_STATUS[a.status]) a.status = "done"; });
  return s;
}
// Version 2 was one fixed map (Delhi → Mumbai → LA). Turn those three places into destinations, and
// add Boston and Japan with the dreams they stand for, so the owner's world carries over intact.
function addTaglines(s){ const TAG = {"d-mumbai": "Love living here", "d-delhi": "One of the home-grounds"}; s.destinations.forEach(d => { if (TAG[d.id] && d.tagline == null) d.tagline = TAG[d.id]; }); }
function upgradeTo3(s){
  s.v = 3;
  s.onboarding.done = s.onboarded; if (s.onboarded) s.onboarding.step = 6;
  if (!s.onboarded && !s.aspirations.length) return s;
  const add = (id, purpose) => { if (!s.destinations.some(d => d.id === id)) s.destinations.push(destFromPlace(id, purpose)); };
  add("d-mumbai", "from"); add("d-delhi", "from"); add("d-boston", "study"); add("d-la", "live"); add("d-japan", "experience");
  layoutAll(s.destinations); addTaglines(s);
  s.aspirations.forEach(a => { if (!a.destinationId) a.destinationId = "d-" + (a.place || "la"); delete a.place; });
  const seed = (id, title, desc, category, kind, timeframe, destinationId) => { if (!s.aspirations.some(a => a.id === id)) s.aspirations.push({id, title, desc, category, kind, timeframe, destinationId, image: null, tint: null, createdAt: today()}); };
  if (!s.categories.includes("Career & education")) s.categories.push("Career & education");
  seed("a-harvard-mde", "Study Design Engineering at Harvard", "The Master in Design Engineering, in Cambridge, Massachusetts. A goal I'm working towards, not something I've done yet.", "Career & education", "campus", "Within 2 years", "d-boston");
  seed("a-japan-drift", "Experience Porsche drifting in Japan", "Mountain roads, a drift circuit and a Porsche sliding sideways with me behind the wheel.", "Experiences & adventures", "drift", "2–5 years", "d-japan");
  return s;
}

let saving = false, dirty = false;
async function save(){
  try { localStorage.setItem(demoMode ? DEMO_KEY : LS_KEY, JSON.stringify(S)); } catch (e) {}
  if (!docRef || demoMode) return;
  if (saving) { dirty = true; return; }
  saving = true;
  try {
    do { dirty = false; await docRef.set(JSON.parse(JSON.stringify(S))); } while (dirty);
    storageNote = "Saved to your Claude account. Only you can see it.";
  } catch (e) {
    storageNote = e && e.code === "quota_exceeded" ? "Your storage is full. Delete some old entries or images." : "Couldn't reach your account, so changes are kept in this browser for now.";
  } finally { saving = false; if (route === "account") renderAccount(); }
}
let storageNote = "Saved in this browser.", lastSynced = "", pendingRender = false;
const typingInPage = () => { const a = document.activeElement; return !!(a && a.closest && a.closest("#pmain") && /INPUT|TEXTAREA|SELECT/.test(a.tagName)); };
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !typingInPage()) { pendingRender = false; afterChange(); } }, 0));
function commit(fn){ fn(S); syncLinkedMilestones(S); afterChange(); save(); }
// A milestone linked to another goal is ticked when that goal is finished, and unticked if it's reopened (only if it was
// ticked that way). Links to deleted goals are dropped.
function syncLinkedMilestones(s){
  for (const g of s.goals) for (const m of g.milestones) {
    if (!m.linkGoal) continue;
    const t = s.goals.find(x => x.id === m.linkGoal);
    if (!t) { delete m.linkGoal; continue; }
    if (t.status === "done" && !m.doneAt) { m.doneAt = t.doneAt || today(); m.auto = true; }
    else if (t.status !== "done" && m.auto) { m.doneAt = null; delete m.auto; }
  }
}

/* =====================================================================
   2. MODEL — derived progress (never stored twice)
   ===================================================================== */
const SIZE_LABEL = {1: "Small step", 2: "Solid push", 3: "Big leap"};
const goalById = id => S.goals.find(g => g.id === id);
const aspById = id => S.aspirations.find(a => a.id === id);
const originalDeadline = g => g.deadlineHistory.length ? g.deadlineHistory[0].from : g.deadline;
const isOverdue = g => g.status === "active" && dayDiff(g.deadline, today()) < 0;
const metDeadline = g => g.status === "done" && !g.pastCity && g.doneAt <= g.deadline;
function goalActivity(g){ return S.entries.filter(e => e.goalIds.includes(g.id)); }
function goalProgress(g){
  const ms = g.milestones, done = ms.filter(m => m.doneAt).length;
  return {steps: ms.length, done, ratio: g.status === "done" ? 1 : ms.length ? done / ms.length : null, entries: goalActivity(g).length};
}
// How clearly an aspiration shows in the world. Comes only from logged work on goals linked to it.
let modelVer = 0, clarVer = -1, discVal = 0; const clarCache = new Map();
function clarityOf(a){
  if (clarVer !== modelVer) { clarCache.clear(); clarVer = modelVer; discVal = -1; }
  if (clarCache.has(a.id)) return clarCache.get(a.id);
  const r = clarityRaw(a); clarCache.set(a.id, r); return r;
}
// A dream unlocks only through finished goals. A goal linked to k dreams counts 1/k towards each, so it's never
// counted twice; let-go and deleted goals don't count. Reopening a goal takes its share back.
// Unlocked = every non-let-go goal linked to the dream is finished, or the dream was confirmed achieved (past cities).
// Derived from the goals each time, so it survives refreshes, follows reopened goals, and never fires twice.
const isUnlocked = a => clarityOf(a).c >= .999;
const lockShown = new Map(), unlockedAt = new Map();
const ICON_LOCK = '<svg class="ico" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function dreamMark(a){
  const open = isUnlocked(a), now = performance.now();
  if (open && lockShown.get(a.id)) unlockedAt.set(a.id, now); // seen locked earlier this visit: let the lock fall away once
  lockShown.set(a.id, !open);
  const going = open && now - (unlockedAt.get(a.id) ?? -1e9) < 1600;
  return `<span class="dmark" role="img" aria-label="${open ? "Dream, unlocked" : "Dream, locked"}">${GI.star}${open ? going ? `<span class="dlock going">${ICON_LOCK}</span>` : "" : `<span class="dlock">${ICON_LOCK}</span>`}</span>`;

function suggestVisuals(text, cat){

// Themes ranked by how many of the dream's words they share (whole words, plurals and -ing forms included).
function classifyDream(text, cat){
  const words = String(text || "").toLowerCase().match(/[a-z0-9-]+/g) || [], forms = new Set();
  for (const w of words) { forms.add(w); forms.add(w.replace(/(ies)$/, "y")); forms.add(w.replace(/(es|s)$/, "")); forms.add(w.replace(/ing$/, "")); forms.add(w.replace(/ed$/, "")); }
  const ranked = THEMES.map((t, i) => ({t, i, n: [...forms].filter(f => t.set.has(f)).length})).filter(x => x.n).sort((a, b) => b.n - a.n || a.i - b.i).map(x => x.t);
  if (!ranked.length && words.length && CAT_THEME[cat]) ranked.push(themeById(CAT_THEME[cat]));
  return ranked;
}

function wireGoalCards(el){

  on("[data-ms]", b => { const [gid, mid] = b.dataset.ms.split("|"); commit(s => { const m = s.goals.find(g => g.id === gid).milestones.find(m => m.id === mid); m.doneAt = m.doneAt ? null : today(); }); });

  el.querySelectorAll("[data-addms]").forEach(f => f.onsubmit = e => { e.preventDefault(); const v = f.querySelector("input").value.trim(); if (!v) return; commit(s => s.goals.find(g => g.id === f.dataset.addms).milestones.push({id: uid(), title: v, desc: "", due: "", doneAt: null})); });
  on("[data-finish]", b => {
    const g = goalById(b.dataset.finish), onTime = today() <= g.deadline;

    setTimeout(() => {
      const before = new Map(S.destinations.map(d => [d.id, cityProgress(d)]));
      commit(s => { const x = s.goals.find(x => x.id === g.id); x.status = "done"; x.doneAt = today(); });
      const lit = S.destinations.filter(d => !isLit(d) && cityProgress(d) > (before.get(d.id) || 0)).map(d => d.name);
      openGoal = null; renderGoals(); toast(lit.length ? `Finished. ${lit.join(" and ")} just got brighter. Open your world to see it.` : onTime ? "Finished on time." : "Finished. It took longer, and it still counts.");
    }, reduced ? 0 : 700);
  });
  on("[data-cancel]", b => { commit(s => { const g = s.goals.find(g => g.id === b.dataset.cancel); g.status = "cancelled"; g.closedAt = today(); }); openGoal = null; toast("Let go. It's kept under Finished, in Let go."); });
  on("[data-reopen]", b => { commit(s => { const g = s.goals.find(g => g.id === b.dataset.reopen); g.status = "active"; g.doneAt = null; g.closedAt = null; delete g.pastCity; }); openGoal = null; goalTab = "active"; renderGoals(); });
  on("[data-editgoal]", b => editGoal(b.dataset.editgoal));

    commit(s => { s.goals = s.goals.filter(g => g.id !== b.dataset.delgoal); s.entries.forEach(e => e.goalIds = e.goalIds.filter(id => id !== b.dataset.delgoal)); });
    openGoal = null; toast("Goal deleted");
  });
}

/* --- THIS WEEK --- */
let weekOf = weekStart(today());
function renderWeek(){
  const el = $("p-week"), ws = weekOf, we = addDays(ws, 6), isNow = ws === weekStart(today());
  const entries = S.entries.filter(e => e.date >= ws && e.date <= we).reverse();
  const goalsMoved = new Set(entries.flatMap(e => e.goalIds));
  const steps = S.goals.flatMap(g => g.milestones.filter(m => m.doneAt && m.doneAt >= ws && m.doneAt <= we));
  const due = S.goals.filter(g => (g.status !== "cancelled") && ((g.deadline >= ws && g.deadline <= we) || g.deadlineHistory.some(h => h.from >= ws && h.from <= we)));
  const metW = due.filter(g => g.status === "done" && g.doneAt <= g.deadline && g.deadline >= ws && g.deadline <= we);
  const passed = due.filter(g => !(g.status === "done" && g.doneAt <= (g.deadlineHistory.find(h => h.from >= ws && h.from <= we)?.from || g.deadline)) && (g.deadlineHistory.some(h => h.from >= ws && h.from <= we) || (g.deadline <= (isNow ? today() : we) && g.status !== "done")));
  const offPlan = entries.filter(e => !e.goalIds.length);
  const insights = [];
  if (entries.length) insights.push(`You logged ${entries.length} thing${entries.length === 1 ? "" : "s"}${goalsMoved.size ? ` and moved ${goalsMoved.size} goal${goalsMoved.size === 1 ? "" : "s"} forward` : ""}.`);
  if (steps.length) insights.push(`${steps.length} step${steps.length === 1 ? "" : "s"} completed: ${steps.slice(0, 3).map(m => esc(m.title)).join(", ")}.`);
  if (offPlan.length) insights.push(`${offPlan.length} ${offPlan.length === 1 ? "piece" : "pieces"} of progress happened outside the plan. That's still progress.`);
  if (metW.length) insights.push(`Deadline met: ${metW.map(g => esc(g.title)).join(", ")}.`);
  if (passed.length) insights.push(`${passed.map(g => esc(g.title)).join(", ")} ${passed.length === 1 ? "ran" : "ran"} past a deadline. Your path changed. You're still building.`);
  el.innerHTML = `
    <div class="phead" style="align-items:center"><h1>${weekTitle(ws)}</h1><div style="display:flex;gap:4px">${isNow ? "" : `<button class="btn quiet" id="wToday">This week</button>`}${canLog(ws) ? `<button class="btn quiet" id="logBtn">${ICON.plus}Log progress</button>` : ""}</div></div>
    ${weekStripHTML(ws)}
    ${weekHistoryHTML()}
    ${!canLog(ws) && ws > weekStart(today()) ? `<p class="muted" style="margin:0;font-size:13px">This week hasn't started yet. You can log progress for this week and last week.</p>` : ""}
    <section class="panel"><div class="eyebrow">Weekly review</div>
      ${insights.length ? `<div class="insight">${insights.map(i => `<div>${i}</div>`).join("")}</div>` : `<p class="muted" style="margin:0">${isNow ? "Nothing logged yet this week. Anything counts: an email sent, a page drafted, a lesson booked." : "Nothing was logged this week."}</p>`}
</section>
    <section style="display:grid;gap:12px"><h2 class="sec">Logged</h2>
      ${entries.length ? `<ul class="gcards">${entries.map(entryRow).join("")}</ul>` : `<div class="empty">Entries you log will appear here, linked to the goals they moved.</div>`}</section>
    ${honestNumbersHTML()}`;
  $("wPrev").onclick = () => { if (weekOf > firstWeek()) { weekOf = addDays(weekOf, -7); renderWeek(); } };
  $("wNext").onclick = () => { if (weekOf < lastWeek()) { weekOf = addDays(weekOf, 7); renderWeek(); } };
  if ($("wToday")) $("wToday").onclick = () => { weekOf = weekStart(today()); renderWeek(); };
  if ($("logBtn")) $("logBtn").onclick = () => logEntry();
  wireWeekHistory();
  el.querySelectorAll("[data-delentry]").forEach(b => b.onclick = () => {
    if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.innerHTML = GI.del + "Tap again"; return; }
    commit(s => { s.entries = s.entries.filter(e => e.id !== b.dataset.delentry); });
  });

}

// Progress is logged per week: an entry's date is the Monday of its week (older entries may still carry a day).

const firstWeek = () => { const ds = S.entries.map(e => e.date).sort(); return ds.length ? weekStart(ds[0]) < weekStart(today()) ? weekStart(ds[0]) : weekStart(today()) : weekStart(today()); };
const lastWeek = () => addDays(weekStart(today()), 14);
const canLog = ws => ws === weekStart(today()) || ws === addDays(weekStart(today()), -7);

  const dots = () => `<div class="progress-dots" aria-label="Step ${step} of 3"><i class="on"></i><i class="${step > 1 ? "on" : ""}"></i><i class="${step > 2 ? "on" : ""}"></i></div>`;
  function draw(){
    const B = $("sheetB"), Fo = $("sheetF");

/* --- WEEKLY HISTORY: jump to any week, search everything you've logged --- */
let weekQuery = "";
function weekSearch(q){
  q = q.trim().toLowerCase(); if (q.length < 2) return [];
  const hits = [], has = t => t && t.toLowerCase().includes(q);
  for (const e of S.entries) { const f = [e.text, e.learned, e.blocked, e.next].find(has); if (f) hits.push({ws: weekStart(e.date), date: e.date, kind: e.type === "did" ? "Accomplished" : "Worked on", text: f}); }
  for (const [ws, r] of Object.entries(S.reflections)) { const f = [r.text, r.next].find(has); if (f) hits.push({ws, date: ws, kind: "Weekly review", text: f}); }
  for (const g of S.goals) {
    if (has(g.title)) { const d = g.doneAt || g.deadline; hits.push({ws: weekStart(d), date: d, kind: g.status === "done" ? "Goal finished" : g.status === "cancelled" ? "Goal let go" : "Goal due", text: g.title}); }
    for (const m of g.milestones) if (m.doneAt && has(m.title)) hits.push({ws: weekStart(m.doneAt), date: m.doneAt, kind: "Step done", text: m.title});
  }
  return hits.sort((a, b) => b.date.localeCompare(a.date)).slice(0, 40);
}
const weekRange = ws => `${fmt(ws, {day: "numeric", month: "short"})} – ${fmt(addDays(ws, 6), {day: "numeric", month: "short", year: "numeric"})}`;
function weekHistoryHTML(){
  const hits = weekSearch(weekQuery), byWeek = new Map(); hits.forEach(h => { if (!byWeek.has(h.ws)) byWeek.set(h.ws, []); byWeek.get(h.ws).push(h); });
  return `<div class="wk-search">
    <div class="wk-box"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" id="wQ" value="${esc(weekQuery)}" placeholder="Search your logs by keyword" aria-label="Search past weeks"></div>
    <div id="wResults">${weekQuery.trim().length < 2 ? "" : hits.length ? [...byWeek].map(([ws, list]) => `<button class="wk-hit" data-week="${ws}"><span class="eyebrow">${esc(weekRange(ws))}</span>${list.slice(0, 3).map(h => `<span><b>${esc(h.kind)}</b> ${esc(h.text.length > 90 ? h.text.slice(0, 90) + "…" : h.text)}</span>`).join("")}${list.length > 3 ? `<span class="muted">+${list.length - 3} more</span>` : ""}</button>`).join("") : `<p class="muted" style="margin:0;font-size:13px">Nothing found for “${esc(weekQuery)}”.</p>`}</div></div>`;
}

  $("wQ").oninput = e => { weekQuery = e.target.value; const pos = e.target.selectionStart; renderWeek(); const i = $("wQ"); i.focus(); i.setSelectionRange(pos, pos); };

/* --- backup and restore: one JSON file holding everything --- */
function backupData(){
  const images = {};
  for (const a of [...S.aspirations, ...S.assets]) if (a.image && a.image.local) { const d = localImg(a.image.local); if (d) images[a.image.local] = d; }
  return JSON.stringify({app: "paint-a-picture", version: 2, exportedAt: new Date().toISOString(), state: S, images});
}
async function downloadBackup(){
  const btn = $("backupBtn"), filename = `paint-a-picture-backup-${today()}.json`;
  btn.disabled = true;
  const done = () => { S.lastBackup = today(); save(); toast("Backup saved. Keep the file somewhere safe."); renderAccount(); };
  try {
    if (downloadsApi) { await downloadsApi.save({filename, data: backupData()}); done(); }
    else if (window.claude?.use) toast("Downloads aren't available in this view. Open the app in your browser to back up.");
    else { // the standalone copy outside claude.ai
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([backupData()], {type: "application/json"})); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); done();
    }
  } catch (e) { toast(e && e.code === "cancelled" ? "Backup not saved." : "Couldn't save the backup file. Try again."); }
  finally { if ($("backupBtn")) $("backupBtn").disabled = false; }
}
async function restoreBackup(file){
  let parsed = null;
  try { parsed = JSON.parse(await file.text()); } catch (e) {}
  const st = parsed && (parsed.app === "paint-a-picture" || parsed.app === "dream-life") && parsed.state;
  if (!st || !Array.isArray(st.goals) || !Array.isArray(st.entries)) { toast("That file isn't a Paint a Picture backup."); return; }
  const incoming = migrate(st), box = $("restoreConfirm");
  const when = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleDateString(undefined, {day: "numeric", month: "short", year: "numeric"}) : "an earlier date";
  box.innerHTML = `<div><b>Restore the backup from ${esc(when)}?</b> It has ${incoming.aspirations.length} dreams, ${incoming.goals.length} goals and ${incoming.entries.length} entries. It replaces what's here now, so download a backup of the current data first if you might want it.</div>
    <div class="actions"><button class="btn sm" id="restoreYes" type="button">Replace with backup</button><button class="btn sm ghost" id="restoreNo" type="button">Cancel</button></div>`;
  box.hidden = false;
  $("restoreNo").onclick = () => { box.hidden = true; };
  $("restoreYes").onclick = () => {
    for (const [k, v] of Object.entries(parsed.images || {})) { try { localStorage.setItem("dreamLife.img." + k, v); } catch (e) {} }
    S = incoming; S.onboarded = true; S.onboarding.done = true; afterChange(); save();
    toast("Restored. Everything from the backup is back."); renderAccount();
  };
}

  const items = [...$("obBuild").children];
  items.forEach((li, i) => setTimeout(() => { li.querySelector(".cb").setAttribute("aria-checked", "true"); if (i === items.length - 1) { $("obReady").hidden = false; $("obEnter").disabled = false; M.querySelector(".ob-h").textContent = "Your world is waiting for you."; } }, reduced ? 0 : 280 + i * 260));
  $("obEnter").onclick = finishOnboarding;
}

/* =====================================================================
   6. BOOT
   ===================================================================== */
try { S = migrate(JSON.parse(localStorage.getItem(LS_KEY) || "null")); } catch (e) { S = blankState(); }
try { if (localStorage.getItem(MODE_KEY) === "demo") { REAL = S; S = loadDemo(); S.profile.avatar = {...REAL.profile.avatar}; demoMode = true; } } catch (e) {}
try { if (localStorage.getItem("dreamLife.hint")) $("hint").hidden = true; } catch (e) {}
markMode();
addEventListener("resize", () => { if (route === "home") { sizeScene(); drawOverview(); } });
updateTitle();
go(location.hash.slice(1) || "home");
requestAnimationFrame(loop);
if (!S.onboarding.done) startOnboarding();

(async () => {
  if (!window.claude?.use) return;
  window.claude.use("sample").then(s => { sampleFn = s; });
  window.claude.use("assets").then(a => { assetsApi = a; });
  window.claude.use("downloads").then(d => { downloadsApi = d; });
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  const id = user ? await user.id() : null;
  if (!db || !id) return;
  docRef = db.doc("data/users/" + id + "/life");
  docRef.onSnapshot(snap => {
    if (snap.exists) {
      if (snap.metadata.hasPendingWrites || saving) return;
      const incoming = JSON.stringify(snap.data());
      if (incoming === lastSynced || incoming === JSON.stringify(demoMode ? REAL : S)) { lastSynced = incoming; return; }
      lastSynced = incoming;
      if (demoMode) { REAL = migrate(JSON.parse(incoming)); try { localStorage.setItem(LS_KEY, JSON.stringify(REAL)); } catch (e) {} return; } // update your real world quietly; the demo stays on screen
      S = migrate(JSON.parse(incoming));
      try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
      storageNote = "Saved to your Claude account. Only you can see it.";
      if (S.onboarding.done && route === "onboard") go("home");
      if (typingInPage()) pendingRender = true; else afterChange();
    } else if (!snap.metadata.fromCache && !demoMode) save();
  }, () => {});
})();
</script>
